<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0A0A">
<title>LOCKED IN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;scroll-behavior:smooth}
:root{
--bg:#0A0A0A;--surface:#111111;--surface2:#161616;--border:#1E1E1E;
--gold:#C8A951;--gold-dim:rgba(200,169,81,.15);
--text:#E8E8E8;--text2:#777;--text3:#444;
--green:#2D5A2D;--greenT:#6BCB77;--red:#5A2D2D;--redT:#CB6B6B;
}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden;min-height:100vh;min-height:100dvh}
input,select,button,textarea{font-family:inherit}
input:focus,select:focus{outline:none;box-shadow:0 0 0 1px rgba(200,169,81,.15)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#222;border-radius:4px}
.mono{font-family:'DM Mono',monospace}

/* NAV */
nav{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid rgba(255,255,255,.04);display:flex;align-items:center;height:48px;padding:0 16px;gap:0}
.nav-brand{color:var(--gold);font-weight:700;font-size:11px;letter-spacing:3px;margin-right:auto;font-family:'DM Mono',monospace}
.nav-btn{background:none;border:none;color:var(--text3);font-size:10px;font-weight:500;letter-spacing:1px;padding:14px 12px;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;font-family:'DM Sans',sans-serif}
.nav-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
@media(max-width:500px){.nav-btn{padding:14px 5px;font-size:7.5px;letter-spacing:.3px}.nav-brand{font-size:8px;letter-spacing:1.5px}}
#sign-out-btn{margin-left:8px;color:var(--text3);border-bottom:none}
#sign-out-btn:hover{color:var(--redT)}

/* MAIN */
.container{max-width:900px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:26px;font-weight:300;letter-spacing:-.5px}
h1 span{color:var(--text3)}
.section-label{color:var(--text2);font-size:11px;letter-spacing:2px;font-weight:500}

/* CARDS */
.card{background:var(--surface);border:1px solid rgba(255,255,255,.04);border-radius:6px;padding:24px;margin-bottom:16px;transition:border-color .2s}
.card:hover{border-color:rgba(255,255,255,.06)}
@media(max-width:500px){.card{padding:16px;margin-bottom:12px}}

/* PROGRESS BAR */
.progress-track{background:#1A1A1A;border-radius:4px;height:6px;overflow:hidden;margin:8px 0}
.progress-fill{background:var(--gold);height:100%;border-radius:4px;transition:width .5s}

.quote{color:var(--text3);font-size:11px;font-style:italic;font-family:'DM Mono',monospace;margin-top:6px;text-align:center}

/* AUTH / ONBOARDING */
.ob-backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.85);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;padding:24px}
.ob-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:48px 40px;max-width:400px;width:100%;text-align:center;animation:fadeUp .5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.ob-brand{color:var(--gold);font-family:'DM Mono',monospace;font-size:18px;font-weight:700;letter-spacing:4px;margin-bottom:8px}
.ob-tagline{color:var(--text2);font-size:13px;margin-bottom:24px}
.ob-divider{height:1px;background:var(--border);margin:0 auto 24px;width:60px}
.ob-label{display:block;color:var(--text2);font-size:10px;letter-spacing:2px;font-weight:500;margin-bottom:12px;text-align:left}
.ob-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px 16px;color:var(--text);font-size:15px;margin-bottom:20px;transition:border-color .2s}
.ob-input:focus{border-color:var(--gold)}
.ob-btn{width:100%;background:var(--gold);color:#0A0A0A;border:none;border-radius:8px;padding:14px;font-size:13px;font-weight:600;letter-spacing:2px;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif}
.ob-btn:disabled{opacity:.3;cursor:default}
.ob-btn:not(:disabled):hover{filter:brightness(1.1)}
.ob-footer{color:var(--text3);font-size:11px;margin-top:16px}
.ob-footer a{color:var(--gold);text-decoration:none}
.ob-footer a:hover{text-decoration:underline}
.auth-error{color:var(--redT);font-size:12px;margin-bottom:12px;text-align:left;display:none}

/* LIFE SCORE */
.life-score-wrap{text-align:center;padding:32px 0}
.life-score-num{font-size:72px;font-weight:300;font-family:'DM Mono',monospace;color:var(--gold);line-height:1;transition:all .5s}
.life-score-label{font-size:11px;color:var(--text2);letter-spacing:3px;margin-top:8px}
.life-score-ring{width:160px;height:160px;margin:0 auto;position:relative;display:flex;align-items:center;justify-content:center}
.life-score-ring svg{position:absolute;transform:rotate(-90deg)}
.life-score-ring circle{fill:none;stroke-width:4;stroke-linecap:round}
.life-score-ring .ring-bg{stroke:var(--border)}
.life-score-ring .ring-fill{stroke:var(--gold);transition:stroke-dashoffset .8s ease}

/* CATEGORY CARDS */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:500px){.cat-grid{grid-template-columns:1fr}}
.cat-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;transition:border-color .2s;cursor:pointer}
.cat-card:hover{border-color:rgba(200,169,81,.2)}
.cat-card-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cat-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.cat-card-name{font-size:10px;letter-spacing:2px;font-weight:500}
.cat-card-pct{font-size:28px;font-weight:300;font-family:'DM Mono',monospace}
.cat-card-sub{font-size:11px;color:var(--text3);margin-top:4px}

/* WEEKLY CHART */
.week-chart{display:flex;gap:6px;align-items:flex-end;height:60px;margin-top:12px}
.week-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.week-bar-fill{width:100%;border-radius:3px;transition:height .3s;min-height:2px}
.week-bar-label{font-size:9px;font-family:'DM Mono',monospace;color:var(--text3)}
.week-bar-label.today{color:var(--gold);font-weight:600}

/* STREAK */
.streak-wrap{display:flex;align-items:center;gap:12px}
.streak-num{font-size:32px;font-weight:300;font-family:'DM Mono',monospace;color:var(--gold)}
.streak-text{font-size:12px;color:var(--text2)}
.streak-fire{font-size:18px;font-family:'DM Mono',monospace;font-weight:700}

/* MONTH PILLS */
.month-pills{display:flex;gap:3px;flex-wrap:wrap}
.month-pill{background:transparent;border:1px solid var(--border);border-radius:4px;padding:4px 7px;font-size:10px;cursor:pointer;font-family:'DM Mono',monospace;color:var(--text2);transition:all .2s}
.month-pill.active{background:var(--gold);color:#0A0A0A;border-color:var(--gold);font-weight:600}
.month-pill.archived{opacity:.35}

/* TRACKER GRID */
.tracker-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
.habit-row{display:flex;margin-bottom:1px;border-radius:4px}
.habit-row:nth-child(odd){background:var(--surface)}
.habit-row:nth-child(even){background:var(--surface2)}
.habit-label{min-width:140px;width:140px;padding:6px 10px;display:flex;align-items:center;font-size:12px;position:sticky;left:0;z-index:2;border-left:3px solid transparent}
.habit-label span.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:500px){.habit-label{min-width:110px;width:110px;font-size:11px;padding:6px 6px}}

.day-header{min-width:34px;width:34px;text-align:center;padding:8px 0;font-size:10px;font-family:'DM Mono',monospace;color:var(--text2)}
.day-header.today{color:var(--gold);font-weight:700;border-bottom:2px solid var(--gold)}
.day-header.past{color:var(--text3)}

.day-cell{min-width:34px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:2px;transition:all .12s;user-select:none;-webkit-user-select:none;border:1px solid transparent}
.day-cell:not(.done):hover{border-color:rgba(200,169,81,.2)}
.day-cell.done{background:var(--gold);animation:pop .2s ease}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.day-cell.past-empty{background:rgba(255,255,255,.02);opacity:1}
.day-cell.today-border{box-shadow:inset 0 0 0 1px rgba(200,169,81,.25)}

.num-input{width:28px;height:24px;background:transparent;border:1px solid var(--border);border-radius:3px;color:var(--gold);font-size:10px;font-family:'DM Mono',monospace;text-align:center}
.num-input:focus{border-color:rgba(200,169,81,.4)}
.num-input.has-val{background:#1A1A10;border-color:rgba(200,169,81,.25)}

.stat-cell{min-width:48px;width:48px;display:flex;align-items:center;justify-content:center;font-size:11px;font-family:'DM Mono',monospace;color:var(--text)}
.pct-badge{font-size:10px;padding:2px 6px;border-radius:3px}
.pct-high{color:var(--greenT);background:var(--green)}
.pct-mid{color:var(--gold)}
.pct-low{color:var(--text3)}

/* CATEGORY HEADER in tracker */
.cat-header-row{display:flex;align-items:center;gap:8px;padding:10px 10px 6px;margin-top:12px}
.cat-header-row:first-child{margin-top:0}
.cat-header-dot{width:8px;height:8px;border-radius:50%}
.cat-header-text{font-size:10px;letter-spacing:2px;font-weight:500}

/* GOALS */
.goal-cat{font-size:11px;letter-spacing:2px;font-weight:500;margin-bottom:10px;margin-top:24px;display:flex;align-items:center;justify-content:space-between}
.goal-cat:first-child{margin-top:0}
.goal-row{display:flex;align-items:center;padding:10px 14px;border-radius:6px;margin-bottom:2px;gap:10px}
.goal-row:nth-child(odd){background:var(--surface)}
.goal-row:nth-child(even){background:var(--surface2)}
.goal-text-input{flex:1;background:transparent;border:none;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif}
.goal-text-input::placeholder{color:var(--text3)}
.goal-target-input{width:60px;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--text3);font-size:10px;font-family:'DM Mono',monospace;text-align:center;padding:4px}
.goal-select{background:var(--surface2);border:1px solid var(--border);border-radius:4px;font-size:11px;padding:5px 8px;font-family:'DM Mono',monospace;cursor:pointer;min-width:95px;color:var(--text)}
.goal-add-btn{background:transparent;border:1px dashed var(--border);border-radius:6px;padding:8px;color:var(--text3);font-size:12px;cursor:pointer;width:100%;margin-top:4px;transition:all .2s}
.goal-add-btn:hover{border-color:var(--gold);color:var(--gold)}
.goal-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:4px;opacity:.4;transition:opacity .2s}
.goal-del:hover{opacity:1;color:var(--redT)}
.goal-progress-bar{display:flex;gap:4px;margin-top:16px;margin-bottom:4px}
.goal-progress-segment{height:4px;border-radius:2px;flex:1}

/* FINANCES */
.fin-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:500px){.fin-summary{grid-template-columns:1fr}}
.fin-stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center}
.fin-stat-value{font-size:28px;font-weight:300;font-family:'DM Mono',monospace;margin-bottom:4px}
.fin-stat-label{font-size:10px;color:var(--text2);letter-spacing:1.5px}
.fin-month-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px}
@media(max-width:500px){.fin-month-grid{grid-template-columns:repeat(3,1fr)}}
.fin-month-cell{text-align:center}
.fin-month-label{font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:4px}
.fin-month-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:4px;font-size:11px;font-family:'DM Mono',monospace;text-align:center;padding:6px 2px}
.fin-month-input.income{color:var(--greenT)}
.fin-month-input.expense{color:var(--redT)}
.fin-month-input.networth{color:var(--gold)}
.stream-row{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.stream-row:last-child{border-bottom:none}
.stream-name{flex:1;background:transparent;border:none;color:var(--text);font-size:13px}
.stream-name::placeholder{color:var(--text3)}
.stream-amount{width:80px;background:transparent;border:none;color:var(--gold);font-family:'DM Mono',monospace;font-size:13px;text-align:right}
.stream-amount::placeholder{color:var(--text3)}
.savings-bar-track{background:#1A1A1A;border-radius:6px;height:10px;overflow:hidden;margin:12px 0}
.savings-bar-fill{background:linear-gradient(90deg,var(--gold),var(--greenT));height:100%;border-radius:6px;transition:width .5s}

/* HABIT MANAGEMENT */
.habit-add-btn{background:transparent;border:1px dashed var(--border);border-radius:4px;padding:6px;color:var(--text3);font-size:11px;cursor:pointer;width:100%;margin-top:4px;transition:all .2s;font-family:'DM Sans',sans-serif}
.habit-add-btn:hover{border-color:var(--gold);color:var(--gold)}
.edit-toggle{background:none;border:1px solid var(--border);border-radius:4px;color:var(--text3);font-size:10px;letter-spacing:1px;padding:6px 12px;cursor:pointer;font-family:'DM Mono',monospace;transition:all .2s}
.edit-toggle:hover,.edit-toggle.active{color:var(--gold);border-color:var(--gold)}
.habit-name-input{background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-size:12px;font-family:'DM Sans',sans-serif;width:80px;padding:2px 0}
.habit-name-input:focus{outline:none;border-bottom-color:var(--gold)}
.habit-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:2px 4px;opacity:.4;transition:opacity .2s;font-family:'DM Mono',monospace}
.habit-del:hover{opacity:1;color:var(--redT)}
.habit-type-toggle{background:none;border:1px solid var(--border);border-radius:3px;color:var(--text3);font-size:9px;padding:2px 5px;cursor:pointer;font-family:'DM Mono',monospace;transition:all .2s}
.habit-type-toggle:hover{color:var(--gold);border-color:var(--gold)}

/* CHECK-IN */
.checkin-step{margin-bottom:24px}
.checkin-step-label{font-size:10px;letter-spacing:2px;font-weight:500;color:var(--text2);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.checkin-step-num{width:20px;height:20px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-family:'DM Mono',monospace;color:var(--text3)}
.checkin-step-num.done{background:var(--gold);color:#0A0A0A;border-color:var(--gold)}
.rating-row{display:flex;gap:6px;flex-wrap:wrap}
.rating-btn{width:40px;height:40px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:14px;font-family:'DM Mono',monospace;cursor:pointer;transition:all .15s}
.rating-btn:hover{border-color:var(--gold);color:var(--gold)}
.rating-btn.active{background:var(--gold);color:#0A0A0A;border-color:var(--gold);font-weight:700}
.checkin-textarea{width:100%;min-height:120px;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;line-height:1.8;padding:16px;resize:vertical}
.checkin-textarea:focus{outline:none;border-color:rgba(200,169,81,.3)}
.checkin-textarea::placeholder{color:var(--text3)}
.pulse-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:6px;margin-bottom:2px;background:var(--surface)}
.pulse-goal-name{flex:1;font-size:13px;color:var(--text)}
.pulse-select{background:var(--surface2);border:1px solid var(--border);border-radius:4px;font-size:10px;padding:5px 8px;font-family:'DM Mono',monospace;cursor:pointer;color:var(--text)}
.checkin-save{width:100%;background:var(--gold);color:#0A0A0A;border:none;border-radius:6px;padding:14px;font-size:12px;font-weight:600;letter-spacing:2px;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;margin-top:8px}
.checkin-save:disabled{opacity:.3;cursor:default}
.checkin-save:not(:disabled):hover{filter:brightness(1.1)}
.past-checkin{cursor:pointer;margin-top:8px}
.past-checkin:hover{border-color:rgba(200,169,81,.15)}
.past-rating{font-size:24px;font-weight:300;font-family:'DM Mono',monospace;color:var(--gold)}

/* VIEW TRANSITIONS */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.view-active{animation:fadeIn .3s ease}
</style>
</head>
<body>

<div id="auth-screen" style="display:none">
  <div class="ob-backdrop">
    <div class="ob-card">
      <div class="ob-brand">LOCKED IN</div>
      <p class="ob-tagline">Track everything. Waste nothing.</p>
      <div class="ob-divider"></div>

      <div id="auth-signup">
        <label class="ob-label">YOUR NAME</label>
        <input id="auth-name" class="ob-input" type="text" placeholder="Enter your name" maxlength="20">
        <label class="ob-label">EMAIL</label>
        <input id="auth-email-up" class="ob-input" type="email" placeholder="you@example.com">
        <label class="ob-label">PASSWORD</label>
        <input id="auth-pass-up" class="ob-input" type="password" placeholder="Min 6 characters">
        <div id="auth-error-up" class="auth-error"></div>
        <button id="auth-submit-up" class="ob-btn" disabled>CREATE ACCOUNT &rarr;</button>
        <p class="ob-footer">Already have an account? <a href="#" id="auth-to-signin">Sign in</a></p>
      </div>

      <div id="auth-signin" style="display:none">
        <label class="ob-label">EMAIL</label>
        <input id="auth-email-in" class="ob-input" type="email" placeholder="you@example.com">
        <label class="ob-label">PASSWORD</label>
        <input id="auth-pass-in" class="ob-input" type="password" placeholder="Your password">
        <div id="auth-error-in" class="auth-error"></div>
        <button id="auth-submit-in" class="ob-btn" disabled>SIGN IN &rarr;</button>
        <p class="ob-footer">Don&rsquo;t have an account? <a href="#" id="auth-to-signup">Sign up</a></p>
      </div>
    </div>
  </div>
</div>

<nav>
  <span class="nav-brand">LOCKED IN</span>
  <button class="nav-btn active" data-view="dashboard">DASHBOARD</button>
  <button class="nav-btn" data-view="tracker">TRACKER</button>
  <button class="nav-btn" data-view="goals">GOALS</button>
  <button class="nav-btn" data-view="journal">CHECK-IN</button>
  <button class="nav-btn" data-view="finances">FINANCES</button>
  <button id="sign-out-btn" class="nav-btn" style="display:none" onclick="signOut()">SIGN OUT</button>
</nav>

<div class="container">
  <div id="v-dashboard"></div>
  <div id="v-tracker" style="display:none"></div>
  <div id="v-goals" style="display:none"></div>
  <div id="v-journal" style="display:none"></div>
  <div id="v-finances" style="display:none"></div>
</div>

function ensureDefaults() {
  if (!state.userName && currentUser && currentUser.user_metadata && currentUser.user_metadata.name) {
    state.userName = currentUser.user_metadata.name;
  }
  if (!state.finances) state.finances = { income: Array(12).fill(0), expenses: Array(12).fill(0), savingsGoal: 5000, savingsCurrent: 0, netWorth: Array(12).fill(0), streams: [] };
  if (!state.finances.streams || !state.finances.streams.length) {
    state.finances.streams = Array(4).fill(null).map(function() { return { name: "", amount: 0 }; });
  }
  if (!state.finances.incomeItems) state.finances.incomeItems = {};
  if (!state.finances.expenseItems) state.finances.expenseItems = {};
  if (state.finMonth === undefined) state.finMonth = TODAY_M;
  if (!state.goals) state.goals = JSON.parse(JSON.stringify(GOALS_DEFAULT));
  if (!state.habits || !state.habits.length) state.habits = JSON.parse(JSON.stringify(DEFAULT_HABITS));
  if (!state.lifeScoreHistory) state.lifeScoreHistory = {};
  if (!state.journal) state.journal = {};
  state.habits.forEach(function(h) { if (h.goalLink === undefined) h.goalLink = ""; });
  if (!state.checkins) state.checkins = {};
  if (state.journal) {
    Object.keys(state.journal).forEach(function(k) {

async function handleSignUp() {
  var name = document.getElementById("auth-name").value.trim();
  var email = document.getElementById("auth-email-up").value.trim();
  var pass = document.getElementById("auth-pass-up").value;

  var btn = document.getElementById("auth-submit-up");
  btn.disabled = true;
  btn.textContent = "CREATING...";
  clearAuthErrors();

  try {
    var result = await sb.auth.signUp({
      email: email,
      password: pass,
      options: { data: { name: name } }
    });

    if (result.error) {
      showAuthError("up", result.error.message);
      btn.disabled = false;
      btn.innerHTML = "CREATE ACCOUNT &rarr;";
      return;
    }

    if (result.data.user && !result.data.session) {
      showAuthError("up", "Check your email to confirm your account, then sign in.");
      btn.disabled = false;
      btn.innerHTML = "CREATE ACCOUNT &rarr;";
      return;
    }

    currentUser = result.data.user;
    state.userName = name;
    state.habits = JSON.parse(JSON.stringify(DEFAULT_HABITS));
    state.goals = JSON.parse(JSON.stringify(GOALS_DEFAULT));
    state.finances = { income: Array(12).fill(0), expenses: Array(12).fill(0), savingsGoal: 5000, savingsCurrent: 0, netWorth: Array(12).fill(0), streams: [], incomeItems: {}, expenseItems: {} };
    state.finances.streams = Array(4).fill(null).map(function() { return { name: "", amount: 0 }; });
    await saveRemote();
    hideAuth();
    switchView("dashboard");
  } catch(e) {
    showAuthError("up", "Something went wrong. Try again.");
    btn.disabled = false;
    btn.innerHTML = "CREATE ACCOUNT &rarr;";
  }
}

async function handleSignIn() {
  var email = document.getElementById("auth-email-in").value.trim();
  var pass = document.getElementById("auth-pass-in").value;

  var btn = document.getElementById("auth-submit-in");
  btn.disabled = true;
  btn.textContent = "SIGNING IN...";
  clearAuthErrors();

  try {
    var result = await sb.auth.signInWithPassword({
      email: email,
      password: pass
    });

    if (result.error) {
      showAuthError("in", result.error.message);
      btn.disabled = false;
      btn.innerHTML = "SIGN IN &rarr;";
      return;
    }

    currentUser = result.data.user;

    try {
      var cached = localStorage.getItem("lockedin_" + currentUser.id);
      if (cached) {
        var p = JSON.parse(cached);
        state = { userName: "", entries: {}, goals: null, finances: null, currentMonth: TODAY_M };
        Object.keys(p).forEach(function(k) { state[k] = p[k]; });

    try {
      var ud = await sb.from("user_data").select("state").eq("user_id", currentUser.id).single();
      if (ud.data && ud.data.state) {
        state = { userName: "", entries: {}, goals: null, finances: null, currentMonth: TODAY_M };

        localStorage.setItem("lockedin_" + currentUser.id, JSON.stringify(state));

    btn.innerHTML = "SIGN IN &rarr;";

async function load() {

    if (!session) {
      showAuth();
      return;
    }

    currentUser = session.user;

    try {

      if (cached) {
        var p = JSON.parse(cached);
        Object.keys(p).forEach(function(k) { state[k] = p[k]; });
      }
    } catch(e2) {}

    // Fetch from Supabase (source of truth)
    try {
      var ud = await sb.from("user_data").select("state").eq("user_id", currentUser.id).single();
      if (ud.data && ud.data.state) {
        Object.keys(ud.data.state).forEach(function(k) { state[k] = ud.data.state[k]; });
        localStorage.setItem("lockedin_" + currentUser.id, JSON.stringify(state));
      }
    } catch(e2) {}

    ensureDefaults();
    hideAuth();
    switchView("dashboard");
  } catch(e) {

  }
}

      updated_at: new Date().toISOString()
    }, { onConflict: "user_id" });

// === UTILITIES ===
function daysInMonth(m) { return new Date(YEAR, m + 1, 0).getDate(); }
function isPast(m, d) { return m < TODAY_M || (m === TODAY_M && d < TODAY_D); }
function isToday(m, d) { return m === TODAY_M && d === TODAY_D; }
function eKey(m, d, hid) { return m + "-" + d + "-" + hid; }
function getEntry(m, d, hid) { return state.entries[eKey(m, d, hid)] || ""; }
function setEntry(m, d, hid, v) { state.entries[eKey(m, d, hid)] = v; save(); }
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

// === DASHBOARD ===
function renderDashboard() {
  var checkHabits = state.habits.filter(function(h) { return h.type === "check"; });
  var m = TODAY_M;
  var daysThisMonth = daysInMonth(m);
  var totalPct = 0;

  checkHabits.forEach(function(h) {
    var done = 0;
    for (var d = 1; d <= Math.min(TODAY_D, daysThisMonth); d++) {
      if (getEntry(m, d, h.id) === "\u2713") done++;
    }
    totalPct += (TODAY_D > 0 ? done / TODAY_D : 0);
  });
  var lifeScore = checkHabits.length ? Math.round((totalPct / checkHabits.length) * 100) : 0;

  function catPct(catId) {
    var habits = state.habits.filter(function(h) { return h.cat === catId && h.type === "check"; });
    if (!habits.length) return 0;
    var total = 0;
    habits.forEach(function(h) {
      var done = 0;
      for (var d = 1; d <= Math.min(TODAY_D, daysThisMonth); d++) {
        if (getEntry(m, d, h.id) === "\u2713") done++;
      }
      total += (TODAY_D > 0 ? done / TODAY_D : 0);
    });
    return Math.round((total / habits.length) * 100);
  }

  var weekDays = [];
  var dayNames = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  for (var i = 6; i >= 0; i--) {
    var dt = new Date(YEAR, TODAY_M, TODAY_D - i);
    var dm = dt.getMonth();
    var dd = dt.getDate();
    var wDone = 0, wTotal = 0;
    checkHabits.forEach(function(h) {
      wTotal++;
      if (getEntry(dm, dd, h.id) === "\u2713") wDone++;
    });
    weekDays.push({ label: dayNames[dt.getDay()], pct: wTotal ? wDone / wTotal : 0, isToday: i === 0 });
  }

  var streak = 0;
  for (var si = 1; si < 365; si++) {
    var sdt = new Date(YEAR, TODAY_M, TODAY_D - si);
    var sdm = sdt.getMonth();
    var sdd = sdt.getDate();
    if (sdt.getFullYear() < YEAR) break;
    var sDone = 0, sTotal = 0;
    checkHabits.forEach(function(h) { sTotal++; if (getEntry(sdm, sdd, h.id) === "\u2713") sDone++; });
    if (sTotal && (sDone / sTotal) >= 0.8) streak++;
    else break;
  }

  var circumference = 2 * Math.PI * 72;
  var offset = circumference - (lifeScore / 100) * circumference;
  var quoteIndex = Math.floor((NOW.getTime() / 86400000)) % QUOTES.length;

  var html = '<div style="margin-bottom:32px">' +
    '<h1>Hey, ' + esc(state.userName) + ' <span>\u00B7 ' + MONTHS[TODAY_M] + ' ' + TODAY_D + '</span></h1>' +
    '</div>' +
    '<div class="card"><div class="life-score-wrap"><div class="life-score-ring">' +
    '<svg width="160" height="160" viewBox="0 0 160 160">' +
    '<circle class="ring-bg" cx="80" cy="80" r="72"/>' +
    '<circle class="ring-fill" cx="80" cy="80" r="72" stroke-dasharray="' + circumference + '" stroke-dashoffset="' + offset + '"/>' +
    '</svg><div><div class="life-score-num">0</div><div class="life-score-label">LIFE SCORE</div></div>' +
    '</div><p class="quote" style="margin-top:16px;opacity:.5">\u201C' + QUOTES[quoteIndex] + '\u201D</p></div></div>' +
    '<div class="cat-grid">';

  CATEGORIES.forEach(function(cat) {
    var pct = catPct(cat.id);
    var pctColor = pct >= 80 ? "var(--greenT)" : (pct >= 50 ? "var(--gold)" : "var(--text3)");
    var habitCount = state.habits.filter(function(h) { return h.cat === cat.id; }).length;
    html += '<div class="cat-card" onclick="switchView(\'tracker\')">' +
      '<div class="cat-card-header"><span class="cat-dot" style="background:' + cat.color + '"></span>' +
      '<span class="cat-card-name" style="color:' + cat.color + '">' + cat.name + '</span></div>' +
      '<div class="cat-card-pct" style="color:' + pctColor + '">' + pct + '%</div>' +
      '<div class="cat-card-sub">' + habitCount + ' habits</div>' +
      '</div>';
  });

  html += '</div><div class="card"><span class="section-label">LAST 7 DAYS</span><div class="week-chart">';

  weekDays.forEach(function(wd) {
    var h = Math.max(2, wd.pct * 50);
    var bg = wd.pct > 0 ? "var(--gold)" : "#1A1A1A";
    html += '<div class="week-bar"><div class="week-bar-fill" style="height:' + h + 'px;background:' + bg + '"></div>' +
      '<span class="week-bar-label' + (wd.isToday ? ' today' : '') + '">' + wd.label + '</span></div>';
  });

  html += '</div></div>' +
    '<div class="card"><div class="streak-wrap">' +
    '<span class="streak-fire" style="color:' + (streak > 0 ? 'var(--gold)' : 'var(--text3)') + '">' + (streak > 0 ? '//' : '--') + '</span>' +
    '<div><div class="streak-num">' + streak + '</div>' +
    '<div class="streak-text">' + (streak === 1 ? 'day' : 'days') + ' streak (80%+ completion)</div></div>' +
    '</div></div>' +
    '<div class="card"><span class="section-label">LIFE TRAJECTORY</span>' +
    '<canvas id="life-chart" style="width:100%;height:200px;margin-top:16px"></canvas></div>';

  // Record today's life score
  var todayKey = YEAR + "-" + String(TODAY_M + 1).padStart(2, "0") + "-" + String(TODAY_D).padStart(2, "0");
  if (state.lifeScoreHistory[todayKey] !== lifeScore) {
    state.lifeScoreHistory[todayKey] = lifeScore;
    save();
  }

  document.getElementById("v-dashboard").innerHTML = html;

  // Animate Life Score count-up
  setTimeout(function() {
    var scoreEl = document.querySelector(".life-score-num");
    if (!scoreEl) return;
    var target = lifeScore;
    var current = 0;
    var step = Math.max(1, Math.ceil(target / 30));
    var iv = setInterval(function() {
      current = Math.min(current + step, target);
      scoreEl.textContent = current;
      if (current >= target) clearInterval(iv);
    }, 20);
  }, 100);

  setTimeout(drawLifeChart, 50);
}

function drawLifeChart() {
  var canvas = document.getElementById("life-chart");
  if (!canvas) return;
  var ctx = canvas.getContext("2d");
  var dpr = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  var W = rect.width;
  var H = rect.height;

  var points = [];
  for (var i = 29; i >= 0; i--) {
    var dt = new Date(YEAR, TODAY_M, TODAY_D - i);
    var key = dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0");
    var val = state.lifeScoreHistory[key];
    if (val !== undefined) points.push({ x: 29 - i, val: val, date: key });
  }

  if (points.length < 2) {
    ctx.fillStyle = "#333";
    ctx.font = "12px 'DM Mono', monospace";
    ctx.textAlign = "center";
    ctx.fillText("Track for 2+ days to see your trajectory", W / 2, H / 2);
    return;
  }

  var padL = 36, padR = 16, padT = 16, padB = 24;
  var chartW = W - padL - padR;
  var chartH = H - padT - padB;

  ctx.strokeStyle = "rgba(255,255,255,.04)";
  ctx.lineWidth = 1;
  [25, 50, 75].forEach(function(v) {
    var y = padT + chartH - (v / 100) * chartH;
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(W - padR, y);
    ctx.stroke();
    ctx.fillStyle = "#333";
    ctx.font = "9px 'DM Mono', monospace";
    ctx.textAlign = "right";
    ctx.fillText(v, padL - 6, y + 3);
  });

  var coords = points.map(function(p) {
    return {
      x: padL + (p.x / 29) * chartW,
      y: padT + chartH - (p.val / 100) * chartH,
      val: p.val
    };
  });

  var grad = ctx.createLinearGradient(0, padT, 0, padT + chartH);
  grad.addColorStop(0, "rgba(200,169,81,.15)");
  grad.addColorStop(1, "rgba(200,169,81,0)");
  ctx.beginPath();
  ctx.moveTo(coords[0].x, padT + chartH);
  coords.forEach(function(c) { ctx.lineTo(c.x, c.y); });
  ctx.lineTo(coords[coords.length - 1].x, padT + chartH);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  ctx.strokeStyle = "#C8A951";
  ctx.lineWidth = 2;
  ctx.lineJoin = "round";
  coords.forEach(function(c, i) {
    if (i === 0) ctx.moveTo(c.x, c.y);
    else ctx.lineTo(c.x, c.y);
  });
  ctx.stroke();

  coords.forEach(function(c) {
    ctx.beginPath();
    ctx.arc(c.x, c.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = "#C8A951";
    ctx.fill();
  });

  var last = coords[coords.length - 1];
  ctx.fillStyle = "#C8A951";
  ctx.font = "bold 11px 'DM Mono', monospace";
  ctx.textAlign = "right";
  ctx.fillText(last.val + "%", last.x - 8, last.y - 8);
}

// === TRACKER ===
function renderTracker() {
  var m = state.currentMonth;
  var days = daysInMonth(m);

  var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px">' +
    '<div style="display:flex;align-items:center;gap:12px"><h1>' + MONTHS[m] + ' <span>' + YEAR + '</span></h1>' +
    '<button class="edit-toggle' + (editingHabits ? ' active' : '') + '" onclick="toggleHabitEdit()">' + (editingHabits ? 'DONE' : 'EDIT') + '</button></div>' +
    '<div class="month-pills">';

  MONTHS.forEach(function(mn, i) {
    var active = i === m ? " active" : "";
    var past = i < TODAY_M ? " archived" : "";
    html += '<button class="month-pill' + active + past + '" onclick="state.currentMonth=' + i + ';save();renderTracker()">' + mn + '</button>';
  });

  html += '</div></div>';

  if (editingHabits) {
    html += '<div style="margin-bottom:16px">';
    CATEGORIES.forEach(function(cat) {
      html += '<div class="cat-header-row"><div class="cat-header-dot" style="background:' + cat.color + '"></div>' +
        '<span class="cat-header-text" style="color:' + cat.color + '">' + cat.name + '</span></div>';
      state.habits.filter(function(h) { return h.cat === cat.id; }).forEach(function(hab) {
        var goals = getGoalList();
        var goalOpts = '<option value="">No goal</option>';
        goals.forEach(function(g) {
          goalOpts += '<option value="' + g.key + '"' + (hab.goalLink === g.key ? ' selected' : '') + '>' + esc(g.label).substring(0, 25) + '</option>';
        });
        html += '<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;margin-bottom:2px;background:var(--surface);border-radius:4px">' +
          '<input class="habit-name-input" value="' + esc(hab.name) + '" oninput="renameHabit(' + hab.id + ',this.value)">' +
          '<select class="goal-select" style="min-width:70px;font-size:9px;padding:3px 4px" onchange="linkHabitGoal(' + hab.id + ',this.value)">' + goalOpts + '</select>' +
          '<button class="habit-type-toggle" onclick="toggleHabitType(' + hab.id + ')">' + hab.type + '</button>' +
          '<button class="habit-del" onclick="removeHabit(' + hab.id + ')">&times;</button>' +
          '</div>';
      });
      html += '<button class="habit-add-btn" onclick="addHabit(\'' + cat.id + '\')">+ Add habit</button>';
    });
    html += '</div>';
    document.getElementById("v-tracker").innerHTML = html;
    return;
  }

  html += '<div class="tracker-wrap"><div style="min-width:600px">';

  // Day headers
  html += '<div style="display:flex;margin-bottom:2px"><div class="habit-label"></div>';
  for (var d = 1; d <= days; d++) {
    var cls = isToday(m, d) ? "today" : (isPast(m, d) ? "past" : "");
    html += '<div class="day-header ' + cls + '">' + d + '</div>';
  }
  html += '<div class="stat-cell" style="font-size:9px;color:var(--text3);letter-spacing:1px">TOT</div>';
  html += '<div class="stat-cell" style="font-size:9px;color:var(--text3);letter-spacing:1px">%</div></div>';

  CATEGORIES.forEach(function(cat) {
    html += '<div class="cat-header-row"><div class="cat-header-dot" style="background:' + cat.color + '"></div>' +
      '<span class="cat-header-text" style="color:' + cat.color + '">' + cat.name + '</span></div>';

    state.habits.filter(function(h) { return h.cat === cat.id; }).forEach(function(hab) {
      var count = 0;
      for (var d = 1; d <= days; d++) {
        var v = getEntry(m, d, hab.id);
        if (hab.type === "check") { if (v === "\u2713") count++; }
        else { count += parseFloat(v) || 0; }
      }
      var pct = hab.type === "check" ? (days ? count / days : 0) : count / days;
      var pctCls = pct >= .8 ? "pct-high" : (pct >= .5 ? "pct-mid" : "pct-low");

      var catColor = CATEGORIES.find(function(c){return c.id===hab.cat;});
      html += '<div class="habit-row"><div class="habit-label" style="background:inherit;border-left-color:' + (catColor ? catColor.color : 'var(--text3)') + '"><span class="name">' + hab.name + '</span></div>';

      for (var d = 1; d <= days; d++) {
        var v = getEntry(m, d, hab.id);
        var past = isPast(m, d);
        var today = isToday(m, d);

        if (hab.type === "check") {
          var done = v === "\u2713";
          var cellCls = "day-cell" + (done ? " done" : "") + (past && !done ? " past-empty" : "") + (today ? " today-border" : "");
          html += '<div class="' + cellCls + '" onclick="toggleCheck(' + m + ',' + d + ',' + hab.id + ')"></div>';
        } else {
          var numCls = v ? "num-input has-val" : "num-input";
          var opSt = past && !v ? "opacity:.35" : "";
          html += '<div class="day-cell' + (today ? " today-border" : "") + '" style="' + opSt + '"><input class="' + numCls + '" value="' + v + '" oninput="setNum(' + m + ',' + d + ',' + hab.id + ',this.value)" inputmode="decimal"></div>';
        }
      }

      html += '<div class="stat-cell">' + (hab.type === "check" ? count : (count || "\u2014")) + '</div>';
      html += '<div class="stat-cell"><span class="pct-badge ' + pctCls + '">' + (hab.type === "check" ? Math.round(pct * 100) + "%" : count.toFixed(1)) + '</span></div>';
      html += '</div>';
    });
  });

  html += '</div></div>';
  document.getElementById("v-tracker").innerHTML = html;
}

function toggleCheck(m, d, hid) {
  var k = eKey(m, d, hid);
  state.entries[k] = state.entries[k] === "\u2713" ? "" : "\u2713";
  save();
  renderTracker();
}

function setNum(m, d, hid, v) {
  setEntry(m, d, hid, v);
}

// === HABIT MANAGEMENT ===
var editingHabits = false;

function toggleHabitEdit() {
  editingHabits = !editingHabits;
  renderTracker();
}

function addHabit(catId) {
  var maxId = state.habits.reduce(function(m, h) { return Math.max(m, h.id); }, 0);
  state.habits.push({ id: maxId + 1, cat: catId, name: "New Habit", type: "check", goalLink: "" });
  save();
  renderTracker();
}

function removeHabit(habitId) {
  state.habits = state.habits.filter(function(h) { return h.id !== habitId; });
  Object.keys(state.entries).forEach(function(k) {
    if (k.endsWith("-" + habitId)) delete state.entries[k];
  });
  save();
  renderTracker();
}

function renameHabit(habitId, newName) {
  var hab = state.habits.find(function(h) { return h.id === habitId; });
  if (hab) { hab.name = newName; save(); }
}

function toggleHabitType(habitId) {
  var hab = state.habits.find(function(h) { return h.id === habitId; });
  if (hab) { hab.type = hab.type === "check" ? "number" : "check"; save(); renderTracker(); }
}

function linkHabitGoal(habitId, goalKey) {
  var hab = state.habits.find(function(h) { return h.id === habitId; });
  if (hab) { hab.goalLink = goalKey; save(); }
}

// === GOALS ===
function renderGoals() {
  var html = '<h1 style="margin-bottom:28px">Goals <span>' + YEAR + '</span></h1>';

  state.goals.forEach(function(sec, si) {
    var done = sec.items.filter(function(g) { return g.s === "Done"; }).length;

    var goalCatObj = CATEGORIES.find(function(c){return c.name===sec.cat;});
    var goalCatColor = goalCatObj ? goalCatObj.color : 'var(--gold)';
    html += '<div class="goal-cat"><span style="display:flex;align-items:center;gap:8px"><span class="cat-dot" style="background:' + goalCatColor + '"></span><span style="color:' + goalCatColor + '">' + sec.cat + '</span></span>' +
      '<span class="mono" style="font-size:10px;color:var(--text3)">' + done + '/' + sec.items.length + ' done</span></div>';

    if (sec.items.length > 0) {
      html += '<div class="goal-progress-bar">';
      sec.items.forEach(function(g) {
        var color = g.s === "Done" ? "var(--greenT)" : (g.s === "In Progress" ? "var(--gold)" : "var(--border)");
        html += '<div class="goal-progress-segment" style="background:' + color + '"></div>';
      });
      html += '</div>';
    }

    sec.items.forEach(function(g, gi) {
      var goalKey = si + "-" + gi;
      var linked = state.habits.filter(function(h) { return h.goalLink === goalKey && h.type === "check"; });
      var habitPct = 0;
      if (linked.length > 0) {
        var totalDone = 0;
        linked.forEach(function(h) {
          var done = 0;
          for (var d = 1; d <= Math.min(TODAY_D, daysInMonth(TODAY_M)); d++) {
            if (getEntry(TODAY_M, d, h.id) === "\u2713") done++;
          }
          totalDone += (TODAY_D > 0 ? done / TODAY_D : 0);
        });
        habitPct = Math.round((totalDone / linked.length) * 100);
      }
      var habitBadge = linked.length > 0 ?
        '<span class="mono" style="font-size:9px;color:var(--gold);min-width:35px;text-align:center">' + habitPct + '%</span>' : '';
      var sc = g.s === "Done" ? "var(--greenT)" : (g.s === "In Progress" ? "var(--gold)" : "var(--text3)");
      html += '<div class="goal-row">' +
        '<input class="goal-text-input" value="' + esc(g.t) + '" placeholder="Enter a goal..." oninput="updGoalText(' + si + ',' + gi + ',this.value)">' +
        '<input class="goal-target-input" value="' + esc(g.d) + '" placeholder="Q1" oninput="updGoalDate(' + si + ',' + gi + ',this.value)">' +
        '<select class="goal-select" style="color:' + sc + '" onchange="updGoalStatus(' + si + ',' + gi + ',this.value)">' +
        '<option' + (g.s === "Not Started" ? " selected" : "") + '>Not Started</option>' +
        '<option' + (g.s === "In Progress" ? " selected" : "") + '>In Progress</option>' +
        '<option' + (g.s === "Done" ? " selected" : "") + '>Done</option>' +
        '</select>' +
        habitBadge +
        '<button class="goal-del" onclick="delGoal(' + si + ',' + gi + ')" title="Remove">\u00D7</button>' +
        '</div>';
    });

    html += '<button class="goal-add-btn" onclick="addGoal(' + si + ')">+ Add Goal</button>';
  });

  document.getElementById("v-goals").innerHTML = html;
}

function updGoalText(si, gi, v) { state.goals[si].items[gi].t = v; save(); }
function updGoalDate(si, gi, v) { state.goals[si].items[gi].d = v; save(); }
function updGoalStatus(si, gi, v) { state.goals[si].items[gi].s = v; save(); renderGoals(); }
function addGoal(si) { state.goals[si].items.push({ t: "", d: "Q2", s: "Not Started" }); save(); renderGoals(); }
function delGoal(si, gi) { state.goals[si].items.splice(gi, 1); save(); renderGoals(); }

// === CHECK-IN ===
var checkinDraft = { rating: 0, reflection: "", goalPulse: {} };

function renderCheckin() {
  var todayKey = YEAR + "-" + String(TODAY_M + 1).padStart(2, "0") + "-" + String(TODAY_D).padStart(2, "0");
  var existing = state.checkins[todayKey];
  var alreadySaved = existing && existing.saved;

  if (alreadySaved) {
    checkinDraft = { rating: existing.rating, reflection: existing.reflection, goalPulse: existing.goalPulse || {} };
  }

  var promptIndex = Math.floor((NOW.getTime() / 86400000)) % CHECKIN_PROMPTS.length;

  var activeGoals = [];
  state.goals.forEach(function(sec, si) {
    sec.items.forEach(function(g, gi) {
      if (g.t.trim() && g.s !== "Done") {
        activeGoals.push({ key: si + "-" + gi, name: g.t, cat: sec.cat });
      }
    });
  });

  var html = '<h1 style="margin-bottom:24px">Check-in <span>' + MONTHS[TODAY_M] + ' ' + TODAY_D + '</span></h1>';

  if (alreadySaved) {
    html += '<div class="card" style="text-align:center;padding:32px">' +
      '<div class="past-rating" style="font-size:48px;margin-bottom:8px">' + existing.rating + '/10</div>' +
      '<div style="color:var(--text2);font-size:12px;margin-bottom:16px">Today\'s check-in saved</div>' +
      '<p style="color:var(--text);font-size:13px;line-height:1.6;text-align:left">' + esc(existing.reflection) + '</p></div>';
  } else {
    html += '<div class="checkin-step"><div class="checkin-step-label">' +
      '<span class="checkin-step-num' + (checkinDraft.rating > 0 ? ' done' : '') + '">1</span> RATE YOUR DAY</div>' +
      '<div class="rating-row">';
    for (var r = 1; r <= 10; r++) {
      html += '<button class="rating-btn' + (checkinDraft.rating === r ? ' active' : '') + '" onclick="checkinDraft.rating=' + r + ';renderCheckin()">' + r + '</button>';
    }
    html += '</div></div>';

    html += '<div class="checkin-step"><div class="checkin-step-label">' +
      '<span class="checkin-step-num' + (checkinDraft.reflection.trim() ? ' done' : '') + '">2</span> REFLECT</div>' +
      '<textarea class="checkin-textarea" placeholder="' + CHECKIN_PROMPTS[promptIndex] + '" oninput="checkinDraft.reflection=this.value;updateCheckinBtn()">' + esc(checkinDraft.reflection) + '</textarea></div>';

    if (activeGoals.length > 0) {
      html += '<div class="checkin-step"><div class="checkin-step-label">' +
        '<span class="checkin-step-num' + (Object.keys(checkinDraft.goalPulse).length >= activeGoals.length ? ' done' : '') + '">3</span> GOAL PULSE</div>';
      activeGoals.forEach(function(g) {
        var val = checkinDraft.goalPulse[g.key] || "";
        html += '<div class="pulse-row">' +
          '<span class="pulse-goal-name">' + esc(g.name).substring(0, 40) + '</span>' +
          '<select class="pulse-select" onchange="checkinDraft.goalPulse[\'' + g.key + '\']=this.value;updateCheckinBtn()">' +
          '<option value=""' + (!val ? ' selected' : '') + '>--</option>' +
          '<option value="Crushing it"' + (val === "Crushing it" ? ' selected' : '') + '>Crushing it</option>' +
          '<option value="On track"' + (val === "On track" ? ' selected' : '') + '>On track</option>' +
          '<option value="Struggling"' + (val === "Struggling" ? ' selected' : '') + '>Struggling</option>' +
          '<option value="Stalled"' + (val === "Stalled" ? ' selected' : '') + '>Stalled</option>' +
          '</select></div>';
      });
      html += '</div>';
    }

    var canSave = checkinDraft.rating > 0 && checkinDraft.reflection.trim();
    html += '<button id="checkin-save-btn" class="checkin-save"' + (canSave ? '' : ' disabled') + ' onclick="saveCheckin()">SAVE CHECK-IN</button>';
  }

  var pastKeys = Object.keys(state.checkins)
    .filter(function(k) { return k !== todayKey && state.checkins[k].saved; })
    .sort(function(a, b) { return b.localeCompare(a); });

  if (pastKeys.length > 0) {
    html += '<div style="margin-top:32px"><span class="section-label">PAST CHECK-INS</span></div>';
    pastKeys.forEach(function(key) {
      var ci = state.checkins[key];
      var dt = new Date(key + "T00:00:00");
      var dayName = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dt.getDay()];
      var preview = ci.reflection ? (ci.reflection.length > 100 ? ci.reflection.substring(0, 100) + "..." : ci.reflection) : "";
      html += '<div class="card past-checkin" onclick="expandCheckin(\'' + key + '\')">' +
        '<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">' +
        '<span class="past-rating">' + (ci.rating || "?") + '</span>' +
        '<span class="mono" style="font-size:10px;color:var(--gold)">' + dayName + ' ' + key + '</span>' +
        '</div>' +
        '<p style="font-size:13px;color:var(--text2);line-height:1.6" id="checkin-text-' + key + '">' + esc(preview) + '</p>' +
        '</div>';
    });
  }

  document.getElementById("v-journal").innerHTML = html;
}

function updateCheckinBtn() {
  var btn = document.getElementById("checkin-save-btn");
  if (btn) btn.disabled = !(checkinDraft.rating > 0 && checkinDraft.reflection.trim());
}

function saveCheckin() {
  var todayKey = YEAR + "-" + String(TODAY_M + 1).padStart(2, "0") + "-" + String(TODAY_D).padStart(2, "0");
  state.checkins[todayKey] = {
    rating: checkinDraft.rating,
    reflection: checkinDraft.reflection,
    goalPulse: checkinDraft.goalPulse,
    saved: true
  };
  save();
  renderCheckin();
}

function expandCheckin(key) {
  var el = document.getElementById("checkin-text-" + key);
  if (el && state.checkins[key]) el.textContent = state.checkins[key].reflection;
}

// === FINANCES ===
function calcMonthTotal(items, monthIndex) {
  var monthItems = items[monthIndex] || [];
  return monthItems.reduce(function(sum, item) {
    return sum + (parseFloat(item.amount) || 0);
  }, 0);
}

function recalcFinances() {
  for (var m = 0; m < 12; m++) {
    state.finances.income[m] = calcMonthTotal(state.finances.incomeItems, m);
    state.finances.expenses[m] = calcMonthTotal(state.finances.expenseItems, m);
  }
}

function addFinItem(type) {
  var fm = state.finMonth;
  var items = type === "income" ? state.finances.incomeItems : state.finances.expenseItems;
  if (!items[fm]) items[fm] = [];
  items[fm].push({ name: "", amount: 0 });
  recalcFinances();
  save();
  renderFinances();
}

function updateFinItem(type, idx, field, val) {
  var fm = state.finMonth;
  var items = type === "income" ? state.finances.incomeItems : state.finances.expenseItems;
  if (!items[fm] || !items[fm][idx]) return;
  items[fm][idx][field] = field === "amount" ? (parseFloat(val) || 0) : val;
  recalcFinances();
  save();
}

function removeFinItem(type, idx) {
  var fm = state.finMonth;
  var items = type === "income" ? state.finances.incomeItems : state.finances.expenseItems;
  if (!items[fm]) return;
  items[fm].splice(idx, 1);
  recalcFinances();
  save();
  renderFinances();
}

function renderFinances() {
  var fin = state.finances;
  var fm = state.finMonth;
  recalcFinances();

  var monthIncome = fin.income[fm] || 0;
  var monthExpense = fin.expenses[fm] || 0;
  var net = monthIncome - monthExpense;
  var savingsPct = fin.savingsGoal ? Math.min(100, Math.round((fin.savingsCurrent / fin.savingsGoal) * 100)) : 0;

  var incItems = fin.incomeItems[fm] || [];
  var expItems = fin.expenseItems[fm] || [];

  // Header + month pills
  var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px">' +
    '<h1>Finances <span>' + YEAR + '</span></h1><div class="month-pills">';

  MONTHS.forEach(function(mn, i) {
    var active = i === fm ? " active" : "";
    var past = i < TODAY_M ? " archived" : "";
    html += '<button class="month-pill' + active + past + '" onclick="state.finMonth=' + i + ';save();renderFinances()">' + mn + '</button>';
  });

  html += '</div></div>';

  // Summary cards
  html += '<div class="fin-summary">' +
    '<div class="fin-stat"><div class="fin-stat-value" style="color:var(--greenT)">$' + monthIncome.toLocaleString() + '</div><div class="fin-stat-label">INCOME</div></div>' +
    '<div class="fin-stat"><div class="fin-stat-value" style="color:var(--redT)">$' + monthExpense.toLocaleString() + '</div><div class="fin-stat-label">EXPENSES</div></div>' +
    '<div class="fin-stat"><div class="fin-stat-value" style="color:' + (net >= 0 ? "var(--greenT)" : "var(--redT)") + '">$' + Math.abs(net).toLocaleString() + '</div><div class="fin-stat-label">' + (net >= 0 ? "SURPLUS" : "DEFICIT") + '</div></div>' +
    '</div>';

  // Income items
  html += '<div class="card"><span class="section-label">INCOME &#183; ' + MONTHS[fm] + '</span><div style="margin-top:14px">';
  incItems.forEach(function(item, i) {
    html += '<div class="stream-row">' +
      '<input class="stream-name" value="' + esc(item.name) + '" placeholder="Income source..." oninput="updateFinItem(\'income\',' + i + ',\'name\',this.value)">' +
      '<span style="color:var(--text3);font-size:12px">$</span>' +
      '<input type="number" class="stream-amount" value="' + (item.amount || "") + '" placeholder="0" oninput="updateFinItem(\'income\',' + i + ',\'amount\',this.value)">' +
      '<button class="habit-del" onclick="removeFinItem(\'income\',' + i + ')">&times;</button>' +
      '</div>';
  });
  html += '</div>' +
    '<button class="habit-add-btn" style="margin-top:8px" onclick="addFinItem(\'income\')">+ Add income</button>' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">' +
    '<span style="color:var(--text2);font-size:12px">Total</span>' +
    '<span class="mono" style="color:var(--greenT);font-size:14px">$' + monthIncome.toLocaleString() + '</span>' +
    '</div></div>';

  // Expense items
  html += '<div class="card"><span class="section-label">EXPENSES &#183; ' + MONTHS[fm] + '</span><div style="margin-top:14px">';
  expItems.forEach(function(item, i) {
    html += '<div class="stream-row">' +
      '<input class="stream-name" value="' + esc(item.name) + '" placeholder="Expense name..." oninput="updateFinItem(\'expense\',' + i + ',\'name\',this.value)">' +
      '<span style="color:var(--text3);font-size:12px">$</span>' +
      '<input type="number" class="stream-amount" style="color:var(--redT)" value="' + (item.amount || "") + '" placeholder="0" oninput="updateFinItem(\'expense\',' + i + ',\'amount\',this.value)">' +
      '<button class="habit-del" onclick="removeFinItem(\'expense\',' + i + ')">&times;</button>' +
      '</div>';
  });
  html += '</div>' +
    '<button class="habit-add-btn" style="margin-top:8px" onclick="addFinItem(\'expense\')">+ Add expense</button>' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">' +
    '<span style="color:var(--text2);font-size:12px">Total</span>' +
    '<span class="mono" style="color:var(--redT);font-size:14px">$' + monthExpense.toLocaleString() + '</span>' +
    '</div></div>';

  // Savings goal
  html += '<div class="card"><span class="section-label">SAVINGS GOAL</span>' +
    '<div style="display:flex;align-items:baseline;gap:12px;margin-top:12px">' +
    '<span style="color:var(--text2);font-size:12px">$</span>' +
    '<input type="number" class="fin-month-input networth" style="width:100px;font-size:16px;padding:8px" value="' + (fin.savingsCurrent || "") + '" placeholder="0" oninput="state.finances.savingsCurrent=parseFloat(this.value)||0;save();renderFinances()">' +
    '<span style="color:var(--text3);font-size:13px">of $' + fin.savingsGoal.toLocaleString() + '</span>' +
    '<span class="mono" style="color:var(--gold);font-size:12px;margin-left:auto">' + savingsPct + '%</span>' +
    '</div>' +
    '<div class="savings-bar-track"><div class="savings-bar-fill" style="width:' + savingsPct + '%"></div></div>' +
    '<div style="display:flex;gap:8px;align-items:center;margin-top:8px">' +
    '<span style="color:var(--text3);font-size:11px">Goal: $</span>' +
    '<input type="number" class="fin-month-input networth" style="width:80px" value="' + (fin.savingsGoal || "") + '" placeholder="5000" oninput="state.finances.savingsGoal=parseFloat(this.value)||0;save();renderFinances()">' +
    '</div></div>';

  // Year overview bar chart
  html += '<div class="card"><span class="section-label">YEAR OVERVIEW</span>' +
    '<div style="display:flex;gap:4px;align-items:flex-end;height:80px;margin-top:16px">';
  var maxVal = 1;
  for (var yi = 0; yi < 12; yi++) {
    maxVal = Math.max(maxVal, fin.income[yi] || 0, fin.expenses[yi] || 0);
  }
  MONTHS.forEach(function(mn, i) {
    var incH = maxVal ? Math.max(1, ((fin.income[i] || 0) / maxVal) * 60) : 1;
    var expH = maxVal ? Math.max(1, ((fin.expenses[i] || 0) / maxVal) * 60) : 1;
    var isActive = i === fm;
    html += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;opacity:' + (isActive ? '1' : '.5') + '" onclick="state.finMonth=' + i + ';save();renderFinances()">' +
      '<div style="display:flex;gap:1px;align-items:flex-end;height:60px">' +
      '<div style="width:4px;height:' + incH + 'px;background:var(--greenT);border-radius:1px"></div>' +
      '<div style="width:4px;height:' + expH + 'px;background:var(--redT);border-radius:1px"></div>' +
      '</div>' +
      '<span style="font-size:8px;font-family:\'DM Mono\',monospace;color:' + (isActive ? 'var(--gold)' : 'var(--text3)') + '">' + mn + '</span>' +
      '</div>';
  });
  html += '</div></div>';

  // Net worth
  html += '<div class="card"><span class="section-label">NET WORTH</span><div class="fin-month-grid">';
  MONTHS.forEach(function(mn, i) {
    html += '<div class="fin-month-cell"><div class="fin-month-label">' + mn + '</div>' +
      '<input type="number" class="fin-month-input networth" value="' + (fin.netWorth[i] || "") + '" placeholder="\u2014" oninput="state.finances.netWorth[' + i + ']=parseFloat(this.value)||0;save()"></div>';
  });
  html += '</div></div>';

  document.getElementById("v-finances").innerHTML = html;
}

// === INIT ===
load();
</script>
</body>
</html>
