<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0A0A">
<title>LOCKED IN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;scroll-behavior:smooth}
:root{
--bg:#0A0A0A;--surface:#111111;--surface2:#161616;--border:#1E1E1E;
--gold:#C8A951;--gold-dim:rgba(200,169,81,.15);
--text:#E8E8E8;--text2:#777;--text3:#444;
--green:#2D5A2D;--greenT:#6BCB77;--red:#5A2D2D;--redT:#CB6B6B;
}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden;min-height:100vh;min-height:100dvh}
input,select,button,textarea{font-family:inherit}
input:focus,select:focus{outline:none;box-shadow:0 0 0 1px rgba(200,169,81,.15)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#222;border-radius:4px}
.mono{font-family:'DM Mono',monospace}

/* NAV */
nav{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid rgba(255,255,255,.04);display:flex;align-items:center;height:48px;padding:0 16px;gap:0}
.nav-brand{color:var(--gold);font-weight:700;font-size:11px;letter-spacing:3px;margin-right:auto;font-family:'DM Mono',monospace}
.nav-btn{background:none;border:none;color:var(--text3);font-size:10px;font-weight:500;letter-spacing:1px;padding:14px 12px;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;font-family:'DM Sans',sans-serif}
.nav-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
@media(max-width:500px){.nav-btn{padding:14px 5px;font-size:7.5px;letter-spacing:.3px}.nav-brand{font-size:8px;letter-spacing:1.5px}}
#sign-out-btn{margin-left:8px;color:var(--text3);border-bottom:none}
#sign-out-btn:hover{color:var(--redT)}

/* MAIN */
.container{max-width:900px;margin:0 auto;padding:10px 12px 80px}
h1{font-size:26px;font-weight:300;letter-spacing:-.5px}
h1 span{color:var(--text3)}
.section-label{color:var(--text2);font-size:11px;letter-spacing:2px;font-weight:500}

/* CARDS */
.card{background:var(--surface);border:1px solid rgba(255,255,255,.04);border-radius:6px;padding:24px;margin-bottom:16px;transition:border-color .2s}
.card:hover{border-color:rgba(255,255,255,.06)}
@media(max-width:500px){.card{padding:16px;margin-bottom:12px}}

/* PROGRESS BAR */
.progress-track{background:#1A1A1A;border-radius:4px;height:6px;overflow:hidden;margin:8px 0}
.progress-fill{background:var(--gold);height:100%;border-radius:4px;transition:width .5s}

/* AUTH / ONBOARDING */
.ob-backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.85);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;padding:24px}
.ob-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:48px 40px;max-width:400px;width:100%;text-align:center;animation:fadeUp .5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.ob-brand{color:var(--gold);font-family:'DM Mono',monospace;font-size:18px;font-weight:700;letter-spacing:4px;margin-bottom:8px}
.ob-tagline{color:var(--text2);font-size:13px;margin-bottom:24px}
.ob-divider{height:1px;background:var(--border);margin:0 auto 24px;width:60px}
.ob-label{display:block;color:var(--text2);font-size:10px;letter-spacing:2px;font-weight:500;margin-bottom:12px;text-align:left}
.ob-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px 16px;color:var(--text);font-size:15px;margin-bottom:20px;transition:border-color .2s}
.ob-input:focus{border-color:var(--gold)}
.ob-btn{width:100%;background:var(--gold);color:#0A0A0A;border:none;border-radius:8px;padding:14px;font-size:13px;font-weight:600;letter-spacing:2px;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif}
.ob-btn:disabled{opacity:.3;cursor:default}
.ob-btn:not(:disabled):hover{filter:brightness(1.1)}
.ob-footer{color:var(--text3);font-size:11px;margin-top:16px}
.ob-footer a{color:var(--gold);text-decoration:none}
.ob-footer a:hover{text-decoration:underline}
.auth-error{color:var(--redT);font-size:12px;margin-bottom:12px;text-align:left;display:none}

.cat-dot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* MONTH PILLS */
.month-pills{display:flex;gap:3px;flex-wrap:wrap}
.month-pill{background:transparent;border:1px solid var(--border);border-radius:4px;padding:4px 7px;font-size:10px;cursor:pointer;font-family:'DM Mono',monospace;color:var(--text2);transition:all .2s}
.month-pill.active{background:var(--gold);color:#0A0A0A;border-color:var(--gold);font-weight:600}
.month-pill.archived{opacity:.35}

/* TRACKER — Dot Grid */
.trk-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -12px;padding:0 12px}
.trk-grid{min-width:700px}
.trk-days{display:flex;align-items:center;margin-bottom:2px}
.trk-day{width:20px;flex-shrink:0;text-align:center;font-size:7px;font-family:'DM Mono',monospace;color:var(--text3);padding:4px 0}
.trk-day.today{color:var(--gold);font-weight:700}
.trk-lbl-spacer{width:110px;flex-shrink:0}
.trk-stat-hdr{width:36px;flex-shrink:0;text-align:center;font-size:7px;font-family:'DM Mono',monospace;color:var(--text3);letter-spacing:.5px;padding:4px 0}
.trk-cat-row{display:flex;align-items:center;gap:6px;padding:10px 0 4px}
.trk-cat-row:first-child{padding-top:4px}
.trk-cat-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.trk-cat-name{font-size:9px;letter-spacing:2px;font-weight:500}
.trk-cat-pct{font-size:10px;font-family:'DM Mono',monospace;flex-shrink:0}
.trk-bar{flex:1;height:3px;background:rgba(255,255,255,.04);border-radius:2px;overflow:hidden;margin:0 10px}
.trk-bar-fill{height:100%;border-radius:2px;transition:width .4s ease}
.trk-row{display:flex;align-items:center;padding:1px 0}
.trk-row:hover .trk-lbl{color:var(--text)}
.trk-lbl{width:110px;flex-shrink:0;font-size:11px;color:var(--text2);padding-left:8px;border-left:2px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s}
.trk-cell{width:20px;height:20px;flex-shrink:0;position:relative;cursor:pointer}
.trk-cell::after{content:'';position:absolute;top:4px;left:4px;right:4px;bottom:4px;border-radius:2px;transition:all .15s}
.trk-cell:hover::after{transform:scale(1.3)}
.trk-cell:not(.done):not(.missed):hover::after{background:rgba(255,255,255,.06)}
.trk-cell.done::after{background:var(--fill)}
.trk-cell.missed::after{background:rgba(255,255,255,.04)}
.trk-cell.empty::after{background:rgba(255,255,255,.025)}
.trk-cell.today-col::after{box-shadow:0 0 0 1.5px rgba(200,169,81,.3)}
.trk-stat{width:36px;flex-shrink:0;text-align:center;font-size:9px;font-family:'DM Mono',monospace;color:var(--text3)}
.trk-stat .hi{color:var(--gold)}
.trk-cell .trk-num{position:absolute;top:4px;left:4px;right:4px;bottom:4px;width:auto;height:auto;background:transparent;border:none;color:var(--gold);font-size:7px;font-family:'DM Mono',monospace;text-align:center;padding:0;border-radius:2px;z-index:1;transition:all .12s}
.trk-cell .trk-num:focus{outline:none;background:rgba(200,169,81,.12)}
.trk-cell.has-val::after{background:var(--fill)}
@media(max-width:600px){
.trk-lbl-spacer,.trk-lbl{width:80px}
.trk-day,.trk-cell{width:16px;height:16px}
.trk-cell::after{top:3px;left:3px;right:3px;bottom:3px}
.trk-cell .trk-num{font-size:6px}
.trk-day{font-size:6px}
.trk-lbl{font-size:9px;padding-left:6px}
.trk-stat{width:28px;font-size:8px}
.trk-stat-hdr{width:28px;font-size:6px}
}

/* GOALS */
.goal-cat{font-size:11px;letter-spacing:2px;font-weight:500;margin-bottom:10px;margin-top:24px;display:flex;align-items:center;justify-content:space-between}
.goal-cat:first-child{margin-top:0}
.goal-row{display:flex;align-items:center;padding:10px 14px;border-radius:6px;margin-bottom:2px;gap:10px}
.goal-row:nth-child(odd){background:var(--surface)}
.goal-row:nth-child(even){background:var(--surface2)}
.goal-text-input{flex:1;background:transparent;border:none;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif}
.goal-text-input::placeholder{color:var(--text3)}
.goal-target-input{width:60px;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--text3);font-size:10px;font-family:'DM Mono',monospace;text-align:center;padding:4px}
.goal-select{background:var(--surface2);border:1px solid var(--border);border-radius:4px;font-size:11px;padding:5px 8px;font-family:'DM Mono',monospace;cursor:pointer;min-width:95px;color:var(--text)}
.goal-add-btn{background:transparent;border:1px dashed var(--border);border-radius:6px;padding:8px;color:var(--text3);font-size:12px;cursor:pointer;width:100%;margin-top:4px;transition:all .2s}
.goal-add-btn:hover{border-color:var(--gold);color:var(--gold)}
.goal-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:4px;opacity:.4;transition:opacity .2s}
.goal-del:hover{opacity:1;color:var(--redT)}
.goal-progress-bar{display:flex;gap:4px;margin-top:16px;margin-bottom:4px}
.goal-progress-segment{height:4px;border-radius:2px;flex:1}

/* FINANCES */
.fin-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:500px){.fin-summary{grid-template-columns:1fr}}
.fin-stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center}
.fin-stat-value{font-size:28px;font-weight:300;font-family:'DM Mono',monospace;margin-bottom:4px}
.fin-stat-label{font-size:10px;color:var(--text2);letter-spacing:1.5px}
.fin-month-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px}
@media(max-width:500px){.fin-month-grid{grid-template-columns:repeat(3,1fr)}}
.fin-month-cell{text-align:center}
.fin-month-label{font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:4px}
.fin-month-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:4px;font-size:11px;font-family:'DM Mono',monospace;text-align:center;padding:6px 2px}
.fin-month-input.income{color:var(--greenT)}
.fin-month-input.expense{color:var(--redT)}
.fin-month-input.networth{color:var(--gold)}
.stream-row{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.stream-row:last-child{border-bottom:none}
.stream-name{flex:1;background:transparent;border:none;color:var(--text);font-size:13px}
.stream-name::placeholder{color:var(--text3)}
.stream-amount{width:80px;background:transparent;border:none;color:var(--gold);font-family:'DM Mono',monospace;font-size:13px;text-align:right}
.stream-amount::placeholder{color:var(--text3)}
.savings-bar-track{background:#1A1A1A;border-radius:6px;height:10px;overflow:hidden;margin:12px 0}
.savings-bar-fill{background:linear-gradient(90deg,var(--gold),var(--greenT));height:100%;border-radius:6px;transition:width .5s}
.recurring-badge{font-size:8px;letter-spacing:1px;padding:2px 5px;border-radius:3px;background:rgba(200,169,81,.12);color:var(--gold);font-family:'DM Mono',monospace;white-space:nowrap}
.override-indicator{font-size:9px;color:var(--text3);text-decoration:line-through;margin-right:4px;font-family:'DM Mono',monospace}
.recurring-section{margin-bottom:16px;padding-bottom:12px;border-bottom:1px dashed var(--border)}

/* HABIT MANAGEMENT */
.habit-add-btn{background:transparent;border:1px dashed var(--border);border-radius:4px;padding:6px;color:var(--text3);font-size:11px;cursor:pointer;width:100%;margin-top:4px;transition:all .2s;font-family:'DM Sans',sans-serif}
.habit-add-btn:hover{border-color:var(--gold);color:var(--gold)}
.edit-toggle{background:none;border:1px solid var(--border);border-radius:4px;color:var(--text3);font-size:10px;letter-spacing:1px;padding:6px 12px;cursor:pointer;font-family:'DM Mono',monospace;transition:all .2s}
.edit-toggle:hover,.edit-toggle.active{color:var(--gold);border-color:var(--gold)}
.habit-name-input{background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-size:12px;font-family:'DM Sans',sans-serif;width:80px;padding:2px 0}
.habit-name-input:focus{outline:none;border-bottom-color:var(--gold)}
.habit-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:2px 4px;opacity:.4;transition:opacity .2s;font-family:'DM Mono',monospace}
.habit-del:hover{opacity:1;color:var(--redT)}
.habit-type-toggle{background:none;border:1px solid var(--border);border-radius:3px;color:var(--text3);font-size:9px;padding:2px 5px;cursor:pointer;font-family:'DM Mono',monospace;transition:all .2s}
.habit-type-toggle:hover{color:var(--gold);border-color:var(--gold)}

/* CHECK-IN */
.checkin-step{margin-bottom:24px}
.checkin-step-label{font-size:10px;letter-spacing:2px;font-weight:500;color:var(--text2);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.checkin-step-num{width:20px;height:20px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-family:'DM Mono',monospace;color:var(--text3)}
.checkin-step-num.done{background:var(--gold);color:#0A0A0A;border-color:var(--gold)}
.rating-row{display:flex;gap:6px;flex-wrap:wrap}
.rating-btn{width:40px;height:40px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:14px;font-family:'DM Mono',monospace;cursor:pointer;transition:all .15s}
.rating-btn:hover{border-color:var(--gold);color:var(--gold)}
.rating-btn.active{background:var(--gold);color:#0A0A0A;border-color:var(--gold);font-weight:700}
.checkin-textarea{width:100%;min-height:120px;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;line-height:1.8;padding:16px;resize:vertical}
.checkin-textarea:focus{outline:none;border-color:rgba(200,169,81,.3)}
.checkin-textarea::placeholder{color:var(--text3)}
.pulse-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:6px;margin-bottom:2px;background:var(--surface)}
.pulse-goal-name{flex:1;font-size:13px;color:var(--text)}
.pulse-select{background:var(--surface2);border:1px solid var(--border);border-radius:4px;font-size:10px;padding:5px 8px;font-family:'DM Mono',monospace;cursor:pointer;color:var(--text)}
.checkin-save{width:100%;background:var(--gold);color:#0A0A0A;border:none;border-radius:6px;padding:14px;font-size:12px;font-weight:600;letter-spacing:2px;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;margin-top:8px}
.checkin-save:disabled{opacity:.3;cursor:default}
.checkin-save:not(:disabled):hover{filter:brightness(1.1)}
.past-checkin{cursor:pointer;margin-top:8px}
.past-checkin:hover{border-color:rgba(200,169,81,.15)}
.past-rating{font-size:24px;font-weight:300;font-family:'DM Mono',monospace;color:var(--gold)}

/* LOADING SPLASH */
#loading-screen{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s ease}
#loading-screen.hide{opacity:0;pointer-events:none}
.load-brand{color:var(--gold);font-family:'DM Mono',monospace;font-size:24px;font-weight:700;letter-spacing:6px;animation:loadPulse 1.5s ease-in-out infinite}
.load-sub{color:var(--text3);font-size:10px;letter-spacing:3px;margin-top:12px;font-family:'DM Mono',monospace}
@keyframes loadPulse{0%,100%{opacity:.4}50%{opacity:1}}

/* EMPTY STATES */
.empty-state{text-align:center;padding:32px 20px}
.empty-state-title{color:var(--gold);font-size:11px;letter-spacing:3px;font-weight:600;font-family:'DM Mono',monospace;margin-bottom:8px}
.empty-state-text{color:var(--text3);font-size:12px;line-height:1.7}
.empty-state-action{color:var(--gold);font-size:12px;cursor:pointer;margin-top:12px;display:inline-block;border-bottom:1px solid rgba(200,169,81,.3);padding-bottom:2px;transition:border-color .2s}
.empty-state-action:hover{border-bottom-color:var(--gold)}
.empty-card{background:var(--surface);border:1px solid rgba(200,169,81,.15);border-radius:6px;padding:28px 24px;text-align:center}

/* VIEW TRANSITIONS */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.view-active{animation:fadeIn .3s ease}

.score-hero{text-align:center;padding:28px 0 12px}
.score-num{font-size:100px;font-weight:300;font-family:'DM Mono',monospace;color:var(--gold);line-height:1;text-shadow:0 0 40px rgba(200,169,81,0.25)}
.score-num.glow-high{text-shadow:0 0 60px rgba(200,169,81,0.35)}
.score-status{font-size:11px;letter-spacing:4px;font-weight:600;font-family:'DM Mono',monospace;margin-top:6px}
.cat-scores{display:flex;justify-content:space-around;padding:16px 0 12px}
.cat-score-item{text-align:center}
.cat-score-label{font-size:8px;letter-spacing:2px;color:#444;font-weight:500;margin-bottom:4px}
.cat-score-num{font-size:26px;font-weight:400;font-family:'DM Mono',monospace}
.stat-pills{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.stat-pill{background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:5px 14px;font-size:10px;font-family:'DM Mono',monospace;color:var(--text2);display:flex;align-items:center;gap:5px}
.stat-pill strong{color:var(--gold);font-weight:600}
@media(max-width:500px){.score-num{font-size:72px}.cat-score-num{font-size:22px}}
.goals-dots{display:flex;align-items:center;gap:6px;padding:6px 0}
.goal-dot{width:9px;height:9px;border-radius:50%}
.goals-count{font-size:10px;font-family:'DM Mono',monospace;color:var(--text2)}
.week-float{display:flex;gap:8px;align-items:flex-end;height:80px;padding:4px 0}
.week-float-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.week-float-pct{font-size:9px;font-family:'DM Mono',monospace;color:var(--text3);min-height:12px}
.week-float-fill{width:100%;border-radius:4px 4px 0 0;transition:height .3s;min-height:2px}
.week-float-fill.today-bar{box-shadow:0 0 8px rgba(200,169,81,0.3)}
.week-float-day{font-size:9px;font-family:'DM Mono',monospace;color:var(--text3)}
.week-float-day.today{color:var(--gold);font-weight:600}
.fin-inline{display:flex;justify-content:center;gap:18px;padding:6px 0;font-family:'DM Mono',monospace;font-size:13px}
@media(max-width:500px){.fin-inline{font-size:11px;gap:10px}}
.dash-divider{height:1px;background:rgba(255,255,255,.04);margin:8px 0}
.dash-section-label{font-size:9px;letter-spacing:2px;color:var(--text3);font-weight:500;margin-bottom:4px}
.quote-block{padding:16px 0 24px;text-align:center}
.quote-text{color:#444;font-size:11px;font-style:italic;font-family:'DM Mono',monospace;line-height:1.7;max-width:500px;margin:0 auto 8px}
.quote-author{color:var(--gold);font-size:9px;letter-spacing:2px;font-family:'DM Mono',monospace}
</style>
</head>
<body>

<div id="loading-screen">
  <div class="load-brand">LOCKED IN</div>
  <div class="load-sub">LOADING</div>
</div>

<div id="auth-screen" style="display:none">
  <div class="ob-backdrop">
    <div class="ob-card">
      <div class="ob-brand">LOCKED IN</div>
      <p class="ob-tagline">Track everything. Waste nothing.</p>
      <div class="ob-divider"></div>

      <div id="auth-signup">
        <label class="ob-label">YOUR NAME</label>
        <input id="auth-name" class="ob-input" type="text" placeholder="Enter your name" maxlength="20">
        <label class="ob-label">EMAIL</label>
        <input id="auth-email-up" class="ob-input" type="email" placeholder="you@example.com">
        <label class="ob-label">PASSWORD</label>
        <input id="auth-pass-up" class="ob-input" type="password" placeholder="Min 6 characters">
        <div id="auth-error-up" class="auth-error"></div>
        <button id="auth-submit-up" class="ob-btn" disabled>CREATE ACCOUNT &rarr;</button>

async function handleSignUp() {
  var name = document.getElementById("auth-name").value.trim();
  var email = document.getElementById("auth-email-up").value.trim();
  var pass = document.getElementById("auth-pass-up").value;

  var btn = document.getElementById("auth-submit-up");
  btn.disabled = true;
  btn.textContent = "CREATING...";
  clearAuthErrors();

  try {
    var result = await sb.auth.signUp({
      email: email,
      password: pass,
      options: { data: { name: name } }
    });

    if (result.error) {
      showAuthError("up", result.error.message);
      btn.disabled = false;
      btn.innerHTML = "CREATE ACCOUNT &rarr;";
      return;
    }

    if (result.data.user && !result.data.session) {
      showAuthError("up", "Check your email to confirm your account, then sign in.");
      btn.disabled = false;
      btn.innerHTML = "CREATE ACCOUNT &rarr;";
      return;
    }

    currentUser = result.data.user;
    state.userName = name;
    state.habits = JSON.parse(JSON.stringify(DEFAULT_HABITS));
    state.goals = JSON.parse(JSON.stringify(GOALS_DEFAULT));
    state.startMonth = TODAY_M;
    state.startDay = TODAY_D;
    state.checkins = {};
    state.finances = { income: Array(12).fill(0), expenses: Array(12).fill(0), savingsGoal: 5000, savingsCurrent: 0, netWorth: Array(12).fill(0), streams: [], incomeItems: {}, expenseItems: {}, recurringIncome: [], recurringExpenses: [], overrides: {} };
    state.finances.streams = Array(4).fill(null).map(function() { return { name: "", amount: 0 }; });
    await saveRemote();
    hideAuth();
    switchView("dashboard");
  } catch(e) {
    showAuthError("up", "Something went wrong. Try again.");
    btn.disabled = false;
    btn.innerHTML = "CREATE ACCOUNT &rarr;";
  }
}

// Listen for auth state changes (handles token refresh, sign-in, sign-out)
sb.auth.onAuthStateChange(function(event, session) {
  if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
    currentUser = session.user;
    if (!appLoaded) { loadUserData(); }
  } else if (event === 'SIGNED_OUT') {
    currentUser = null;

    showAuth();
  }
});

async function loadUserData() {
  if (!currentUser) return;
  // Try localStorage cache first for instant render
  try {
    var cached = localStorage.getItem("lockedin_" + currentUser.id);
    if (cached) {
      var p = JSON.parse(cached);
      Object.keys(p).forEach(function(k) { state[k] = p[k]; });
    }
  } catch(e2) {}

  // Fetch from Supabase (source of truth)
  try {
    var ud = await sb.from("user_data").select("state").eq("user_id", currentUser.id).single();
    if (ud.data && ud.data.state) {
      Object.keys(ud.data.state).forEach(function(k) { state[k] = ud.data.state[k]; });
      localStorage.setItem("lockedin_" + currentUser.id, JSON.stringify(state));
    }
  } catch(e2) {}

  ensureDefaults();
  hideAuth();
  appLoaded = true;
  switchView("dashboard");
}

async function load() {
  try {
    var sessionResult = await sb.auth.getSession();
    var session = sessionResult.data.session;

    if (!session) {
      showAuth();
      return;
    }

    currentUser = session.user;
    await loadUserData();
  } catch(e) {
    showAuth();
  }
}

var saveTimer = null;

function save() {
  if (currentUser) {
    try { localStorage.setItem("lockedin_" + currentUser.id, JSON.stringify(state)); } catch(e) {}
  }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveRemote, 300);
}

async function saveRemote() {
  if (!currentUser) return;
  try {
    await sb.from("user_data").upsert({
      user_id: currentUser.id,
      state: state,
      updated_at: new Date().toISOString()
    }, { onConflict: "user_id" });
  } catch(e) {}
}

// === UTILITIES ===
function daysInMonth(m) { return new Date(YEAR, m + 1, 0).getDate(); }
function isPast(m, d) { return m < TODAY_M || (m === TODAY_M && d < TODAY_D); }
function isToday(m, d) { return m === TODAY_M && d === TODAY_D; }
function firstActiveDay(m) { return (m === state.startMonth) ? state.startDay : 1; }
function isBeforeStart(m, d) { return m < state.startMonth || (m === state.startMonth && d < state.startDay); }
function eKey(m, d, hid) { return m + "-" + d + "-" + hid; }
function getEntry(m, d, hid) { return state.entries[eKey(m, d, hid)] || ""; }
function setEntry(m, d, hid, v) { state.entries[eKey(m, d, hid)] = v; save(); }
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

  document.querySelectorAll(".nav-btn").forEach(function(b) {

  });
  ["dashboard","tracker","goals","journal","finances"].forEach(function(v) {
    var el = document.getElementById("v-" + v);
    if (v === id) {
      el.style.display = "block";
      el.classList.remove("view-active");
      void el.offsetWidth;
      el.classList.add("view-active");
    } else {
      el.style.display = "none";
    }
  });
  if (id === "dashboard") renderDashboard();
  if (id === "tracker") renderTracker();
  if (id === "goals") renderGoals();
  if (id === "journal") renderCheckin();
  if (id === "finances") renderFinances();
}

function renderDashboard() {
  var checkHabits = state.habits.filter(function(h) { return h.type === "check"; });
  var m = TODAY_M;
  var daysThisMonth = daysInMonth(m);
  var totalPct = 0;

  var fad = firstActiveDay(m);
  var activeDays = Math.max(1, Math.min(TODAY_D, daysThisMonth) - fad + 1);

  checkHabits.forEach(function(h) {
    var done = 0;
    for (var d = fad; d <= Math.min(TODAY_D, daysThisMonth); d++) {
      if (getEntry(m, d, h.id) === "\u2713") done++;
    }
    totalPct += (activeDays > 0 ? done / activeDays : 0);
  });
  var lifeScore = checkHabits.length ? Math.round((totalPct / checkHabits.length) * 100) : 0;

  function catPct(catId) {
    var habits = state.habits.filter(function(h) { return h.cat === catId && h.type === "check"; });
    if (!habits.length) return 0;
    var total = 0;
    habits.forEach(function(h) {
      var done = 0;
      for (var d = fad; d <= Math.min(TODAY_D, daysThisMonth); d++) {
        if (getEntry(m, d, h.id) === "\u2713") done++;
      }
      total += (activeDays > 0 ? done / activeDays : 0);
    });
    return Math.round((total / habits.length) * 100);
  }

  // === TEMP DEMO MODE — remove after screenshot ===
  var DEMO = false;
  if (DEMO) {
    lifeScore = 92;
    var _catPct = catPct;
    catPct = function(id) {
      if (id === "money") return 88;
      if (id === "body") return 95;
      if (id === "mind") return 82;
      if (id === "spirit") return 91;
      return _catPct(id);
    };
  }
  // === END TEMP DEMO ===

  // Today done / total
  var todayDone = 0, todayTotal = 0;
  state.habits.forEach(function(h) {
    todayTotal++;
    if (h.type === "check") {
      if (getEntry(m, TODAY_D, h.id) === "\u2713") todayDone++;
    } else {
      if (getEntry(m, TODAY_D, h.id)) todayDone++;
    }
  });

  // Today's mood from checkins
  var todayKey = YEAR + "-" + String(TODAY_M + 1).padStart(2, "0") + "-" + String(TODAY_D).padStart(2, "0");
  var todayCheckin = state.checkins ? state.checkins[todayKey] : null;
  var todayMood = todayCheckin && todayCheckin.rating ? todayCheckin.rating + "/10" : "--";

  var weekDays = [];
  var dayNames = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var weekTotalPct = 0;
  for (var i = 6; i >= 0; i--) {
    var dt = new Date(YEAR, TODAY_M, TODAY_D - i);
    var dm = dt.getMonth();
    var dd = dt.getDate();
    var wDone = 0, wTotal = 0;
    checkHabits.forEach(function(h) {
      wTotal++;
      if (getEntry(dm, dd, h.id) === "\u2713") wDone++;
    });
    var dayPct = wTotal ? wDone / wTotal : 0;
    weekTotalPct += dayPct;
    weekDays.push({ label: dayNames[dt.getDay()], pct: dayPct, isToday: i === 0 });
  }
  var weekAvg = Math.round((weekTotalPct / 7) * 100);

  var streak = 0;
  for (var si = 1; si < 365; si++) {
    var sdt = new Date(YEAR, TODAY_M, TODAY_D - si);
    var sdm = sdt.getMonth();
    var sdd = sdt.getDate();
    if (sdt.getFullYear() < YEAR) break;
    var sDone = 0, sTotal = 0;
    checkHabits.forEach(function(h) { sTotal++; if (getEntry(sdm, sdd, h.id) === "\u2713") sDone++; });
    if (sTotal && (sDone / sTotal) >= 0.8) streak++;
    else break;
  }

  // Active goals with linked habit %
  var activeGoals = [];
  state.goals.forEach(function(sec, si) {
    sec.items.forEach(function(g, gi) {
      if (!g.t.trim()) return;
      var goalKey = si + "-" + gi;
      var linked = state.habits.filter(function(h) { return h.goalLink === goalKey && h.type === "check"; });
      var habitPct = 0;
      if (linked.length > 0) {
        var totalLinkedDone = 0;
        linked.forEach(function(h) {
          var cnt = 0;
          for (var d = fad; d <= Math.min(TODAY_D, daysThisMonth); d++) {
            if (getEntry(TODAY_M, d, h.id) === "\u2713") cnt++;
          }
          totalLinkedDone += (activeDays > 0 ? cnt / activeDays : 0);
        });
        habitPct = Math.round((totalLinkedDone / linked.length) * 100);
      }
      activeGoals.push({ name: g.t, status: g.s, pct: habitPct, cat: sec.cat, hasLink: linked.length > 0 });
    });
  });
  var goalsDoneCount = activeGoals.filter(function(g) { return g.status === "Done"; }).length;

  // Financial snapshot
  recalcFinances();
  var fin = state.finances;
  var finIncome = fin.income[TODAY_M] || 0;
  var finExpense = fin.expenses[TODAY_M] || 0;
  var finNet = finIncome - finExpense;
  var savingsPct = fin.savingsGoal ? Math.min(100, Math.round((fin.savingsCurrent / fin.savingsGoal) * 100)) : 0;

  // Status label based on score
  var statusLabel, statusColor;
  if (lifeScore >= 80) { statusLabel = "LOCKED IN"; statusColor = "var(--gold)"; }
  else if (lifeScore >= 60) { statusLabel = "ON FIRE"; statusColor = "var(--gold)"; }
  else if (lifeScore >= 40) { statusLabel = "BUILDING"; statusColor = "var(--text2)"; }
  else if (lifeScore >= 20) { statusLabel = "WARMING UP"; statusColor = "var(--text3)"; }
  else { statusLabel = "JUST STARTING"; statusColor = "var(--text3)"; }

  var quoteIndex = Math.floor((NOW.getTime() / 86400000)) % QUOTES.length;
  var goalsInProgress = activeGoals.filter(function(g) { return g.status === "In Progress"; }).length;
  var goalsNotStarted = activeGoals.filter(function(g) { return g.status !== "Done" && g.status !== "In Progress"; }).length;

  // === TEMP DEMO OVERRIDES — remove after screenshot ===
  if (DEMO) {
    todayDone = 11; todayTotal = 12;
    todayMood = "9/10";
    streak = 23;
    weekDays = [
      { label: "Thu", pct: 0.85, isToday: false },
      { label: "Fri", pct: 0.92, isToday: false },
      { label: "Sat", pct: 0.78, isToday: false },
      { label: "Sun", pct: 0.88, isToday: false },
      { label: "Mon", pct: 0.95, isToday: false },
      { label: "Tue", pct: 0.90, isToday: false },
      { label: "Wed", pct: 0.93, isToday: true }
    ];
    weekAvg = 89;
    activeGoals = [
      { name: "Save $10K emergency fund", status: "In Progress", pct: 72, cat: "money" },
      { name: "Run 5K under 25 min", status: "Done", pct: 100, cat: "body" },
      { name: "Read 24 books this year", status: "In Progress", pct: 58, cat: "mind" },
      { name: "Meditate 30 days straight", status: "In Progress", pct: 85, cat: "spirit" },
      { name: "Bench press 225 lbs", status: "In Progress", pct: 90, cat: "body" },
      { name: "Launch side project", status: "Done", pct: 100, cat: "money" },
      { name: "Daily journaling habit", status: "In Progress", pct: 78, cat: "spirit" }
    ];
    goalsDoneCount = 2;
    goalsInProgress = 5;
    goalsNotStarted = 0;
    finIncome = 8450;
    finExpense = 3280;
    finNet = 5170;
  }
  // === END TEMP DEMO OVERRIDES ===

  // === BUILD HTML (V6 — typography-first dashboard) ===
  // 1. Header
  var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">' +
    '<h1 style="font-size:17px;font-weight:400">Hey, ' + esc(state.userName) + ' <span>\u00B7 ' + MONTHS[TODAY_M] + ' ' + TODAY_D + '</span></h1>' +
    '<span class="mono" style="font-size:8px;color:var(--text3);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + QUOTES[quoteIndex].text.substring(0, 42) + '\u2026</span>' +
    '</div>';

  // 2. The Score (Hero)
  var glowClass = lifeScore >= 80 ? ' glow-high' : '';
  html += '<div class="score-hero">' +
    '<div id="dash-score-num" class="score-num' + glowClass + '">0</div>' +
    '<div class="score-status" style="color:' + statusColor + '">' + (lifeScore === 0 && !DEMO ? 'YOUR JOURNEY BEGINS' : statusLabel) + '</div></div>';
  if (lifeScore === 0 && !DEMO) {
    html += '<div class="empty-state" style="padding:8px 0 0"><div class="empty-state-text">Start tracking habits to see your score climb</div>' +
      '<span class="empty-state-action" onclick="switchView(\'tracker\')">Open Tracker &rarr;</span></div>';
  }

  // 3. Category Scores
  html += '<div class="cat-scores">';
  CATEGORIES.forEach(function(cat) {
    var pct = catPct(cat.id);
    html += '<div class="cat-score-item">' +
      '<div class="cat-score-label">' + cat.name + '</div>' +
      '<div class="cat-score-num" style="color:' + cat.color + '">' + pct + '%</div></div>';
  });
  html += '</div>';

  // 4. Stat Pills
  html += '<div class="stat-pills">' +
    '<div class="stat-pill"><strong>' + todayDone + '/' + todayTotal + '</strong> TODAY</div>' +
    '<div class="stat-pill"><strong>' + streak + '</strong> STREAK</div>' +
    '<div class="stat-pill"><strong>' + todayMood + '</strong> MOOD</div>' +
    '</div>';

  // 5. Goals as dots
  html += '<div class="dash-divider"></div><div class="goals-dots">' +
    '<span class="dash-section-label" style="margin-right:4px">GOALS</span>';
  activeGoals.forEach(function(g) {
    var dc = g.status === "Done" ? "var(--greenT)" : (g.status === "In Progress" ? "var(--gold)" : "var(--text3)");
    html += '<span class="goal-dot" style="background:' + dc + '" title="' + esc(g.name) + '"></span>';
  });
  if (activeGoals.length === 0) {
    html += '<span class="empty-state-action" onclick="switchView(\'goals\')" style="font-size:9px">Set your first goal &rarr;</span>';
  } else {
    html += '<span class="goals-count" style="margin-left:auto">' + goalsDoneCount + ' done \u00B7 ' + goalsInProgress + ' active</span>';
  }
  html += '</div>';

  // 6. Weekly floating bars
  var hasWeekData = weekDays.some(function(wd) { return wd.pct > 0; });
  html += '<div class="dash-divider"></div>' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1px">' +
    '<span class="dash-section-label">LAST 7 DAYS</span>' +
    '<span class="mono" style="font-size:8px;color:var(--gold)">' + (hasWeekData || DEMO ? weekAvg + '% avg' : '') + '</span></div>';
  if (!hasWeekData && !DEMO) {
    html += '<div class="empty-state" style="padding:16px 0"><div class="empty-state-text">Your week starts now.</div></div>';
  } else {
    html += '<div class="week-float">';
    weekDays.forEach(function(wd) {
      var h = Math.max(2, wd.pct * 68);
      var todayCls = wd.isToday ? ' today-bar' : '';
      html += '<div class="week-float-bar">' +
        '<span class="week-float-pct">' + (wd.pct > 0 ? Math.round(wd.pct * 100) + '%' : '') + '</span>' +
        '<div class="week-float-fill' + todayCls + '" style="height:' + h + 'px;background:' + (wd.pct > 0 ? 'linear-gradient(to top,rgba(200,169,81,.45),var(--gold))' : '#1A1A1A') + '"></div>' +
        '<span class="week-float-day' + (wd.isToday ? ' today' : '') + '">' + wd.label + '</span></div>';
    });
    html += '</div>';
  }

  // 7. Finance — inline colored text
  html += '<div class="dash-divider"></div>';
  if (finIncome === 0 && finExpense === 0 && !DEMO) {
    html += '<div class="empty-state" style="padding:8px 0"><span class="empty-state-action" onclick="switchView(\'finances\')">Track your money in Finances &rarr;</span></div>';
  } else {
    html += '<div class="fin-inline">' +
      '<span style="color:var(--greenT)">$' + finIncome.toLocaleString() + ' in</span>' +
      '<span style="color:var(--text3)">\u00B7</span>' +
      '<span style="color:var(--redT)">$' + finExpense.toLocaleString() + ' out</span>' +
      '<span style="color:var(--text3)">\u00B7</span>' +
      '<span style="color:' + (finNet >= 0 ? 'var(--gold)' : 'var(--redT)') + '">' + (finNet >= 0 ? '+' : '-') + '$' + Math.abs(finNet).toLocaleString() + ' net</span></div>';
  }

  // 8. Life Trajectory (floating canvas)
  html += '<div class="dash-divider"></div><span class="dash-section-label">LIFE TRAJECTORY</span>' +
    '<canvas id="life-chart" style="width:100%;height:220px;margin-top:4px"></canvas>';

  // 9. Bottom quote
  html += '<div class="quote-block"><div class="quote-text">\u201C' + QUOTES[quoteIndex].text + '\u201D</div>' +
    '<div class="quote-author">\u2014 ' + QUOTES[quoteIndex].author + '</div></div>';

  // Record today's life score
  if (!DEMO && state.lifeScoreHistory[todayKey] !== lifeScore) {
    state.lifeScoreHistory[todayKey] = lifeScore;
    save();
  }
  // TEMP DEMO: inject fake trajectory + checkin data
  if (DEMO) {
    var _origHist = {};
    Object.keys(state.lifeScoreHistory).forEach(function(k) { _origHist[k] = state.lifeScoreHistory[k]; });
    var _origCheckins = state.checkins ? JSON.parse(JSON.stringify(state.checkins)) : {};
    for (var di = 29; di >= 0; di--) {
      var ddt = new Date(YEAR, TODAY_M, TODAY_D - di);
      var dk = ddt.getFullYear() + "-" + String(ddt.getMonth() + 1).padStart(2, "0") + "-" + String(ddt.getDate()).padStart(2, "0");
      var base = 55 + di * 1.2;
      state.lifeScoreHistory[dk] = Math.min(97, Math.round(base + Math.sin(di * 0.7) * 12));
      if (!state.checkins) state.checkins = {};
      state.checkins[dk] = { rating: Math.min(10, Math.max(5, Math.round(6 + Math.sin(di * 0.5) * 2.5))) };
    }
    state.lifeScoreHistory[todayKey] = 92;
  }

  document.getElementById("v-dashboard").innerHTML = html;

  // Animate Life Score count-up
  setTimeout(function() {
    var scoreEl = document.getElementById("dash-score-num");
    if (!scoreEl) return;
    var target = lifeScore;
    var current = 0;
    var step = Math.max(1, Math.ceil(target / 30));
    var iv = setInterval(function() {
      current = Math.min(current + step, target);
      scoreEl.textContent = current;
      if (current >= target) clearInterval(iv);
    }, 20);
  }, 100);

  setTimeout(drawLifeChart, 50);

  // TEMP DEMO: restore original data after charts draw
  if (DEMO) {
    setTimeout(function() {
      state.lifeScoreHistory = _origHist;
      state.checkins = _origCheckins;
    }, 200);
  }
}

function drawLifeChart() {
  var canvas = document.getElementById("life-chart");
  if (!canvas) return;
  var ctx = canvas.getContext("2d");
  var dpr = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  var W = rect.width;
  var H = rect.height;

  var points = [];
  for (var i = 29; i >= 0; i--) {
    var dt = new Date(YEAR, TODAY_M, TODAY_D - i);
    var key = dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0");
    var val = state.lifeScoreHistory[key];
    if (val !== undefined) points.push({ x: 29 - i, val: val, date: key });
  }

  if (points.length < 2) {
    ctx.strokeStyle = "rgba(200,169,81,.15)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(36, H / 2);
    ctx.lineTo(W - 16, H / 2);
    ctx.stroke();
    ctx.fillStyle = "#444";
    ctx.font = "11px 'DM Mono', monospace";
    ctx.textAlign = "center";
    ctx.fillText("Track for 2+ days to see your trajectory", W / 2, H / 2 - 12);
    return;
  }

  var padL = 36, padR = 16, padT = 20, padB = 24;
  var chartW = W - padL - padR;
  var chartH = H - padT - padB;

  // Auto-scale Y axis
  var dataMin = 100, dataMax = 0;
  points.forEach(function(p) {
    if (p.val < dataMin) dataMin = p.val;
    if (p.val > dataMax) dataMax = p.val;
  });
  var range = dataMax - dataMin;
  if (range < 10) range = 10;
  var yPad = Math.max(5, Math.round(range * 0.15));
  var yMin = Math.max(0, dataMin - yPad);
  var yMax = Math.min(100, dataMax + yPad);
  var yRange = yMax - yMin;

  function valToY(v) {
    return padT + chartH - ((v - yMin) / yRange) * chartH;
  }

  // Dynamic grid lines
  var gridStep = yRange <= 20 ? 5 : (yRange <= 50 ? 10 : 25);
  var gridStart = Math.ceil(yMin / gridStep) * gridStep;
  for (var gv = gridStart; gv <= yMax; gv += gridStep) {
    var gy = valToY(gv);
    ctx.strokeStyle = "rgba(255,255,255,.04)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, gy);
    ctx.lineTo(W - padR, gy);
    ctx.stroke();
    ctx.fillStyle = "#333";
    ctx.font = "9px 'DM Mono', monospace";
    ctx.textAlign = "right";
    ctx.fillText(gv, padL - 6, gy + 3);
  }

  // Map points to coordinates
  var maxIdx = Math.max(1, points.length - 1);
  var coords = points.map(function(p, i) {
    return { x: padL + (i / maxIdx) * chartW, y: valToY(p.val), val: p.val };
  });

  // Catmull-Rom smooth path helper
  function drawSmoothPath(pts) {
    ctx.moveTo(pts[0].x, pts[0].y);
    if (pts.length === 2) {
      ctx.lineTo(pts[1].x, pts[1].y);
      return;
    }
    for (var si = 0; si < pts.length - 1; si++) {
      var p0 = pts[Math.max(0, si - 1)];
      var p1 = pts[si];
      var p2 = pts[si + 1];
      var p3 = pts[Math.min(pts.length - 1, si + 2)];
      var cp1x = p1.x + (p2.x - p0.x) / 6;
      var cp1y = p1.y + (p2.y - p0.y) / 6;
      var cp2x = p2.x - (p3.x - p1.x) / 6;
      var cp2y = p2.y - (p3.y - p1.y) / 6;
      ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
    }
  }

  // Fill area under curve
  var grad = ctx.createLinearGradient(0, padT, 0, padT + chartH);
  grad.addColorStop(0, "rgba(200,169,81,.18)");
  grad.addColorStop(1, "rgba(200,169,81,0)");
  ctx.beginPath();
  ctx.moveTo(coords[0].x, padT + chartH);
  ctx.lineTo(coords[0].x, coords[0].y);
  drawSmoothPath(coords);
  ctx.lineTo(coords[coords.length - 1].x, padT + chartH);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Draw smooth line
  ctx.beginPath();
  ctx.strokeStyle = "#C8A951";
  ctx.lineWidth = 2.5;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  drawSmoothPath(coords);
  ctx.stroke();

  // Data point dots
  coords.forEach(function(c) {
    ctx.beginPath();
    ctx.arc(c.x, c.y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = "#C8A951";
    ctx.fill();
  });

  // Endpoint glow
  var last = coords[coords.length - 1];
  var glowGrad = ctx.createRadialGradient(last.x, last.y, 2, last.x, last.y, 12);
  glowGrad.addColorStop(0, "rgba(200,169,81,0.6)");
  glowGrad.addColorStop(1, "rgba(200,169,81,0)");
  ctx.beginPath();
  ctx.arc(last.x, last.y, 12, 0, Math.PI * 2);
  ctx.fillStyle = glowGrad;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(last.x, last.y, 4, 0, Math.PI * 2);
  ctx.fillStyle = "#C8A951";
  ctx.fill();

  // Score label at endpoint
  ctx.fillStyle = "#C8A951";
  ctx.font = "bold 11px 'DM Mono', monospace";
  ctx.textAlign = "right";
  ctx.fillText(last.val + "%", last.x - 10, last.y - 10);

  // Day rating line (mood from check-ins)
  var ratingPoints = [];
  for (var ri = 29; ri >= 0; ri--) {
    var rdt = new Date(YEAR, TODAY_M, TODAY_D - ri);
    var rkey = rdt.getFullYear() + "-" + String(rdt.getMonth() + 1).padStart(2, "0") + "-" + String(rdt.getDate()).padStart(2, "0");
    var ci = state.checkins ? state.checkins[rkey] : null;
    if (ci && ci.rating) ratingPoints.push({ x: 29 - ri, val: ci.rating * 10, date: rkey });
  }

  if (ratingPoints.length >= 2) {
    var rMaxIdx = Math.max(1, ratingPoints.length - 1);
    var rCoords = ratingPoints.map(function(p, ri2) {
      return { x: padL + (ri2 / rMaxIdx) * chartW, y: valToY(p.val), val: p.val };
    });

    ctx.beginPath();
    ctx.strokeStyle = "rgba(107,203,119,.5)";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.lineJoin = "round";
    drawSmoothPath(rCoords);
    ctx.stroke();
    ctx.setLineDash([]);

    var rLast = rCoords[rCoords.length - 1];
    ctx.fillStyle = "rgba(107,203,119,.7)";
    ctx.font = "9px 'DM Mono', monospace";
    ctx.textAlign = "left";
    ctx.fillText(Math.round(rLast.val / 10) + "/10", rLast.x + 6, rLast.y + 3);
  }
}

// === TRACKER ===
function catHex(c) {
  if (c === 'var(--gold)') return '#C8A951';
  if (c === 'var(--greenT)') return '#6BCB77';
  return c;
}

function renderTracker() {
  var m = state.currentMonth;
  var days = daysInMonth(m);
  var fadT = firstActiveDay(m);
  var daysToCount = m === TODAY_M ? Math.max(1, Math.min(TODAY_D, days) - fadT + 1) : (m > state.startMonth ? days : Math.max(1, days - fadT + 1));

  // Header
  var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px">' +
    '<div style="display:flex;align-items:center;gap:12px"><h1>' + MONTHS[m] + ' <span>' + YEAR + '</span></h1>' +
    '<button class="edit-toggle' + (editingHabits ? ' active' : '') + '" onclick="toggleHabitEdit()">' + (editingHabits ? 'DONE' : 'EDIT') + '</button></div>' +
    '<div class="month-pills">';

  MONTHS.forEach(function(mn, i) {
    var active = i === m ? " active" : "";
    var past = i < TODAY_M ? " archived" : "";
    html += '<button class="month-pill' + active + past + '" onclick="state.currentMonth=' + i + ';save();renderTracker()">' + mn + '</button>';
  });
  html += '</div></div>';

  // Edit mode
  if (editingHabits) {
    html += '<div style="margin-bottom:16px">';
    CATEGORIES.forEach(function(cat) {
      html += '<div class="trk-cat-row"><div class="trk-cat-dot" style="background:' + cat.color + '"></div>' +
        '<span class="trk-cat-name" style="color:' + cat.color + '">' + cat.name + '</span></div>';
      state.habits.filter(function(h) { return h.cat === cat.id; }).forEach(function(hab) {
        var goals = getGoalList();
        var goalOpts = '<option value="">No goal</option>';
        goals.forEach(function(g) {
          goalOpts += '<option value="' + g.key + '"' + (hab.goalLink === g.key ? ' selected' : '') + '>' + esc(g.label).substring(0, 25) + '</option>';
        });
        html += '<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;margin-bottom:2px;background:var(--surface);border-radius:4px">' +
          '<input class="habit-name-input" value="' + esc(hab.name) + '" oninput="renameHabit(' + hab.id + ',this.value)">' +
          '<select class="goal-select" style="min-width:70px;font-size:9px;padding:3px 4px" onchange="linkHabitGoal(' + hab.id + ',this.value)">' + goalOpts + '</select>' +
          '<button class="habit-type-toggle" onclick="toggleHabitType(' + hab.id + ')">' + hab.type + '</button>' +
          '<button class="habit-del" onclick="removeHabit(' + hab.id + ')">&times;</button>' +
          '</div>';
      });
      html += '<button class="habit-add-btn" onclick="addHabit(\'' + cat.id + '\')">+ Add habit</button>';
    });
    html += '</div>';
    document.getElementById("v-tracker").innerHTML = html;
    return;
  }

  // Grid view
  html += '<div class="trk-wrap"><div class="trk-grid">';

  // Day headers
  html += '<div class="trk-days"><div class="trk-lbl-spacer"></div>';
  for (var d = 1; d <= days; d++) {
    html += '<div class="trk-day' + (isToday(m, d) ? ' today' : '') + '">' + d + '</div>';
  }
  html += '<div class="trk-stat-hdr">TOT</div><div class="trk-stat-hdr">%</div></div>';

  // Categories
  CATEGORIES.forEach(function(cat) {
    var catHabits = state.habits.filter(function(h) { return h.cat === cat.id; });
    if (!catHabits.length) return;

    var checkH = catHabits.filter(function(h) { return h.type === "check"; });
    var catDone = 0, catTotal = 0;
    var lastDay = m === TODAY_M ? Math.min(TODAY_D, days) : days;
    checkH.forEach(function(h) {
      for (var cd = fadT; cd <= lastDay; cd++) {
        catTotal++;
        if (getEntry(m, cd, h.id) === "\u2713") catDone++;
      }
    });
    var catPctVal = catTotal > 0 ? Math.round((catDone / catTotal) * 100) : 0;

    html += '<div class="trk-cat-row"><div class="trk-cat-dot" style="background:' + cat.color + '"></div>' +
      '<span class="trk-cat-name" style="color:' + cat.color + '">' + cat.name + '</span>' +
      '<div class="trk-bar"><div class="trk-bar-fill" style="width:' + catPctVal + '%;background:' + cat.color + '"></div></div>' +
      '<span class="trk-cat-pct" style="color:' + cat.color + '">' + catPctVal + '%</span></div>';

    var hx = catHex(cat.color);
    var cr = parseInt(hx.slice(1,3),16), cg = parseInt(hx.slice(3,5),16), cb = parseInt(hx.slice(5,7),16);

    catHabits.forEach(function(hab) {
      var count = 0;
      for (var cd = 1; cd <= days; cd++) {
        var cv = getEntry(m, cd, hab.id);
        if (hab.type === "check") { if (cv === "\u2713") count++; }
        else { count += parseFloat(cv) || 0; }
      }
      var pct = hab.type === "check" ? (daysToCount ? count / daysToCount : 0) : 0;
      var pctDisplay = hab.type === "check" ? Math.round(pct * 100) + '%' : (count ? count.toFixed(1) : '\u2014');

      html += '<div class="trk-row"><div class="trk-lbl" style="border-left-color:' + cat.color + '">' + esc(hab.name) + '</div>';

      for (var d = 1; d <= days; d++) {
        var v = getEntry(m, d, hab.id);
        var past = isPast(m, d);
        var today = isToday(m, d);

        var pre = isBeforeStart(m, d);
        if (hab.type === "check") {
          var done = v === "\u2713";
          var cls = 'trk-cell';
          if (pre) cls += ' empty';
          else if (done) cls += ' done';
          else if (past) cls += ' missed';
          else if (!today) cls += ' empty';
          if (today) cls += ' today-col';
          var st = done ? '--fill:rgba(' + cr + ',' + cg + ',' + cb + ',.45)' : '';
          html += '<div class="' + cls + '" style="' + st + '" onclick="' + (pre ? '' : 'toggleCheck(' + m + ',' + d + ',' + hab.id + ')') + '"></div>';
        } else {
          var ncls = 'trk-cell';
          if (pre) ncls += ' empty';
          else if (v) ncls += ' has-val';
          else if (past) ncls += ' missed';
          else if (!today) ncls += ' empty';
          if (today) ncls += ' today-col';
          var nst = v ? '--fill:rgba(' + cr + ',' + cg + ',' + cb + ',.45)' : '';
          html += '<div class="' + ncls + '" style="' + nst + '"><input class="trk-num" value="' + v + '" oninput="setNum(' + m + ',' + d + ',' + hab.id + ',this.value)" inputmode="decimal"></div>';
        }
      }

      html += '<div class="trk-stat">' + (hab.type === "check" ? count : (count || '\u2014')) + '</div>';
      html += '<div class="trk-stat">' + (pct >= .8 ? '<span class="hi">' + pctDisplay + '</span>' : pctDisplay) + '</div>';
      html += '</div>';
    });
  });

  html += '</div></div>';

  // Tracker empty state hint
  var hasAnyEntry = false;
  var checkKeys = Object.keys(state.entries);
  for (var ei = 0; ei < checkKeys.length; ei++) {
    if (state.entries[checkKeys[ei]]) { hasAnyEntry = true; break; }
  }
  if (!hasAnyEntry) {
    html += '<div class="empty-state" style="padding:16px 0"><div class="empty-state-text" style="color:var(--text3)">Tap a cell to mark it done for the day</div></div>';
  }

  document.getElementById("v-tracker").innerHTML = html;
}

function toggleCheck(m, d, hid) {
  var k = eKey(m, d, hid);
  state.entries[k] = state.entries[k] === "\u2713" ? "" : "\u2713";
  save();
  renderTracker();
}

function setNum(m, d, hid, v) {
  setEntry(m, d, hid, v);
}

// === HABIT MANAGEMENT ===
var editingHabits = false;

function toggleHabitEdit() {
  editingHabits = !editingHabits;
  renderTracker();
}

function addHabit(catId) {
  var maxId = state.habits.reduce(function(m, h) { return Math.max(m, h.id); }, 0);
  state.habits.push({ id: maxId + 1, cat: catId, name: "New Habit", type: "check", goalLink: "" });
  save();
  renderTracker();
}

function removeHabit(habitId) {
  state.habits = state.habits.filter(function(h) { return h.id !== habitId; });
  Object.keys(state.entries).forEach(function(k) {
    if (k.endsWith("-" + habitId)) delete state.entries[k];
  });
  save();
  renderTracker();
}

function renameHabit(habitId, newName) {
  var hab = state.habits.find(function(h) { return h.id === habitId; });
  if (hab) { hab.name = newName; save(); }
}

function toggleHabitType(habitId) {
  var hab = state.habits.find(function(h) { return h.id === habitId; });
  if (hab) { hab.type = hab.type === "check" ? "number" : "check"; save(); renderTracker(); }
}

function linkHabitGoal(habitId, goalKey) {
  var hab = state.habits.find(function(h) { return h.id === habitId; });
  if (hab) { hab.goalLink = goalKey; save(); }
}

// === GOALS ===
function renderGoals() {
  var html = '<h1 style="margin-bottom:28px">Goals <span>' + YEAR + '</span></h1>';

  // Goals empty state
  var totalGoalsWithText = 0;
  state.goals.forEach(function(sec) { sec.items.forEach(function(g) { if (g.t.trim()) totalGoalsWithText++; }); });
  if (totalGoalsWithText < 2) {
    html += '<div class="empty-card" style="margin-bottom:24px">' +
      '<div class="empty-state-title">SET YOUR TARGETS</div>' +
      '<div class="empty-state-text">Define what you want to achieve this year.<br>Start with one goal per category below.</div></div>';
  }

  state.goals.forEach(function(sec, si) {
    var done = sec.items.filter(function(g) { return g.s === "Done"; }).length;

    var goalCatObj = CATEGORIES.find(function(c){return c.name===sec.cat;});
    var goalCatColor = goalCatObj ? goalCatObj.color : 'var(--gold)';
    html += '<div class="goal-cat"><span style="display:flex;align-items:center;gap:8px"><span class="cat-dot" style="background:' + goalCatColor + '"></span><span style="color:' + goalCatColor + '">' + sec.cat + '</span></span>' +
      '<span class="mono" style="font-size:10px;color:var(--text3)">' + done + '/' + sec.items.length + ' done</span></div>';

    if (sec.items.length > 0) {
      html += '<div class="goal-progress-bar">';
      sec.items.forEach(function(g) {
        var color = g.s === "Done" ? "var(--greenT)" : (g.s === "In Progress" ? "var(--gold)" : "var(--border)");
        html += '<div class="goal-progress-segment" style="background:' + color + '"></div>';
      });
      html += '</div>';
    }

    sec.items.forEach(function(g, gi) {
      var goalKey = si + "-" + gi;
      var linked = state.habits.filter(function(h) { return h.goalLink === goalKey && h.type === "check"; });
      var habitPct = 0;
      if (linked.length > 0) {
        var totalDone = 0;
        linked.forEach(function(h) {
          var done = 0;
          for (var d = firstActiveDay(TODAY_M); d <= Math.min(TODAY_D, daysInMonth(TODAY_M)); d++) {
            if (getEntry(TODAY_M, d, h.id) === "\u2713") done++;
          }
          var gad = Math.max(1, Math.min(TODAY_D, daysInMonth(TODAY_M)) - firstActiveDay(TODAY_M) + 1);
          totalDone += (gad > 0 ? done / gad : 0);
        });
        habitPct = Math.round((totalDone / linked.length) * 100);
      }
      var habitBadge = linked.length > 0 ?
        '<span class="mono" style="font-size:9px;color:var(--gold);min-width:35px;text-align:center">' + habitPct + '%</span>' : '';
      var sc = g.s === "Done" ? "var(--greenT)" : (g.s === "In Progress" ? "var(--gold)" : "var(--text3)");
      html += '<div class="goal-row">' +
        '<input class="goal-text-input" value="' + esc(g.t) + '" placeholder="Enter a goal..." oninput="updGoalText(' + si + ',' + gi + ',this.value)">' +
        '<input class="goal-target-input" value="' + esc(g.d) + '" placeholder="Q1" oninput="updGoalDate(' + si + ',' + gi + ',this.value)">' +
        '<select class="goal-select" style="color:' + sc + '" onchange="updGoalStatus(' + si + ',' + gi + ',this.value)">' +
        '<option' + (g.s === "Not Started" ? " selected" : "") + '>Not Started</option>' +
        '<option' + (g.s === "In Progress" ? " selected" : "") + '>In Progress</option>' +
        '<option' + (g.s === "Done" ? " selected" : "") + '>Done</option>' +
        '</select>' +
        habitBadge +
        '<button class="goal-del" onclick="delGoal(' + si + ',' + gi + ')" title="Remove">\u00D7</button>' +
        '</div>';
    });

    html += '<button class="goal-add-btn" onclick="addGoal(' + si + ')">+ Add Goal</button>';
  });

  document.getElementById("v-goals").innerHTML = html;
}

function updGoalText(si, gi, v) { state.goals[si].items[gi].t = v; save(); }
function updGoalDate(si, gi, v) { state.goals[si].items[gi].d = v; save(); }
function updGoalStatus(si, gi, v) { state.goals[si].items[gi].s = v; save(); renderGoals(); }
function addGoal(si) { state.goals[si].items.push({ t: "", d: "Q2", s: "Not Started" }); save(); renderGoals(); }
function delGoal(si, gi) { state.goals[si].items.splice(gi, 1); save(); renderGoals(); }

// === CHECK-IN ===
var checkinDraft = { rating: 0, reflection: "", goalPulse: {} };

function renderCheckin() {
  var todayKey = YEAR + "-" + String(TODAY_M + 1).padStart(2, "0") + "-" + String(TODAY_D).padStart(2, "0");
  var existing = state.checkins[todayKey];
  var alreadySaved = existing && existing.saved;

  if (alreadySaved) {
    checkinDraft = { rating: existing.rating, reflection: existing.reflection, goalPulse: existing.goalPulse || {} };
  }

  var promptIndex = Math.floor((NOW.getTime() / 86400000)) % CHECKIN_PROMPTS.length;

  var activeGoals = [];
  state.goals.forEach(function(sec, si) {
    sec.items.forEach(function(g, gi) {
      if (g.t.trim() && g.s !== "Done") {
        activeGoals.push({ key: si + "-" + gi, name: g.t, cat: sec.cat });
      }
    });
  });

  var html = '<h1 style="margin-bottom:24px">Check-in <span>' + MONTHS[TODAY_M] + ' ' + TODAY_D + '</span></h1>';

  if (alreadySaved) {
    html += '<div class="card" style="text-align:center;padding:32px">' +
      '<div class="past-rating" style="font-size:48px;margin-bottom:8px">' + existing.rating + '/10</div>' +
      '<div style="color:var(--text2);font-size:12px;margin-bottom:16px">Today\'s check-in saved</div>' +
      '<p style="color:var(--text);font-size:13px;line-height:1.6;text-align:left">' + esc(existing.reflection) + '</p></div>';
  } else {
    html += '<div class="checkin-step"><div class="checkin-step-label">' +
      '<span class="checkin-step-num' + (checkinDraft.rating > 0 ? ' done' : '') + '">1</span> RATE YOUR DAY</div>' +
      '<div class="rating-row">';
    for (var r = 1; r <= 10; r++) {
      html += '<button class="rating-btn' + (checkinDraft.rating === r ? ' active' : '') + '" onclick="checkinDraft.rating=' + r + ';renderCheckin()">' + r + '</button>';
    }
    html += '</div></div>';

    html += '<div class="checkin-step"><div class="checkin-step-label">' +
      '<span class="checkin-step-num' + (checkinDraft.reflection.trim() ? ' done' : '') + '">2</span> REFLECT</div>' +
      '<textarea class="checkin-textarea" placeholder="' + CHECKIN_PROMPTS[promptIndex] + '" oninput="checkinDraft.reflection=this.value;updateCheckinBtn()">' + esc(checkinDraft.reflection) + '</textarea></div>';

    if (activeGoals.length > 0) {
      html += '<div class="checkin-step"><div class="checkin-step-label">' +
        '<span class="checkin-step-num' + (Object.keys(checkinDraft.goalPulse).length >= activeGoals.length ? ' done' : '') + '">3</span> GOAL PULSE</div>';
      activeGoals.forEach(function(g) {
        var val = checkinDraft.goalPulse[g.key] || "";
        html += '<div class="pulse-row">' +
          '<span class="pulse-goal-name">' + esc(g.name).substring(0, 40) + '</span>' +
          '<select class="pulse-select" onchange="checkinDraft.goalPulse[\'' + g.key + '\']=this.value;updateCheckinBtn()">' +
          '<option value=""' + (!val ? ' selected' : '') + '>--</option>' +
          '<option value="Crushing it"' + (val === "Crushing it" ? ' selected' : '') + '>Crushing it</option>' +
          '<option value="On track"' + (val === "On track" ? ' selected' : '') + '>On track</option>' +
          '<option value="Struggling"' + (val === "Struggling" ? ' selected' : '') + '>Struggling</option>' +
          '<option value="Stalled"' + (val === "Stalled" ? ' selected' : '') + '>Stalled</option>' +
          '</select></div>';
      });
      html += '</div>';
    }

    var canSave = checkinDraft.rating > 0 && checkinDraft.reflection.trim();
    html += '<button id="checkin-save-btn" class="checkin-save"' + (canSave ? '' : ' disabled') + ' onclick="saveCheckin()">SAVE CHECK-IN</button>';
  }

  var pastKeys = Object.keys(state.checkins)
    .filter(function(k) { return k !== todayKey && state.checkins[k].saved; })
    .sort(function(a, b) { return b.localeCompare(a); });

  if (pastKeys.length > 0) {
    html += '<div style="margin-top:32px"><span class="section-label">PAST CHECK-INS</span></div>';
    pastKeys.forEach(function(key) {
      var ci = state.checkins[key];
      var dt = new Date(key + "T00:00:00");
      var dayName = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dt.getDay()];
      var preview = ci.reflection ? (ci.reflection.length > 100 ? ci.reflection.substring(0, 100) + "..." : ci.reflection) : "";
      html += '<div class="card past-checkin" onclick="expandCheckin(\'' + key + '\')">' +
        '<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">' +
        '<span class="past-rating">' + (ci.rating || "?") + '</span>' +
        '<span class="mono" style="font-size:10px;color:var(--gold)">' + dayName + ' ' + key + '</span>' +
        '</div>' +
        '<p style="font-size:13px;color:var(--text2);line-height:1.6" id="checkin-text-' + key + '">' + esc(preview) + '</p>' +
        '</div>';
    });
  }

  document.getElementById("v-journal").innerHTML = html;
}

function updateCheckinBtn() {
  var btn = document.getElementById("checkin-save-btn");
  if (btn) btn.disabled = !(checkinDraft.rating > 0 && checkinDraft.reflection.trim());
}

function saveCheckin() {
  var todayKey = YEAR + "-" + String(TODAY_M + 1).padStart(2, "0") + "-" + String(TODAY_D).padStart(2, "0");
  state.checkins[todayKey] = {
    rating: checkinDraft.rating,
    reflection: checkinDraft.reflection,
    goalPulse: checkinDraft.goalPulse,
    saved: true
  };
  save();
  renderCheckin();
}

function expandCheckin(key) {
  var el = document.getElementById("checkin-text-" + key);
  if (el && state.checkins[key]) el.textContent = state.checkins[key].reflection;
}

// === FINANCES ===
function calcMonthTotal(items, monthIndex) {
  var monthItems = items[monthIndex] || [];
  return monthItems.reduce(function(sum, item) {
    return sum + (parseFloat(item.amount) || 0);
  }, 0);
}

function recalcFinances() {
  for (var m = 0; m < 12; m++) {
    var monthOverrides = state.finances.overrides[m] || {};
    var incOverrides = monthOverrides.income || {};
    var expOverrides = monthOverrides.expense || {};

    var recurInc = 0;
    state.finances.recurringIncome.forEach(function(item) {
      var amt = incOverrides[item.name] !== undefined ? incOverrides[item.name] : item.amount;
      recurInc += (parseFloat(amt) || 0);
    });

    var recurExp = 0;
    state.finances.recurringExpenses.forEach(function(item) {
      var amt = expOverrides[item.name] !== undefined ? expOverrides[item.name] : item.amount;
      recurExp += (parseFloat(amt) || 0);
    });

    state.finances.income[m] = recurInc + calcMonthTotal(state.finances.incomeItems, m);
    state.finances.expenses[m] = recurExp + calcMonthTotal(state.finances.expenseItems, m);
  }
}

function addFinItem(type) {
  var fm = state.finMonth;
  var items = type === "income" ? state.finances.incomeItems : state.finances.expenseItems;
  if (!items[fm]) items[fm] = [];
  items[fm].push({ name: "", amount: 0 });
  recalcFinances();
  save();
  renderFinances();
}

function updateFinItem(type, idx, field, val) {
  var fm = state.finMonth;
  var items = type === "income" ? state.finances.incomeItems : state.finances.expenseItems;
  if (!items[fm] || !items[fm][idx]) return;
  items[fm][idx][field] = field === "amount" ? (parseFloat(val) || 0) : val;
  recalcFinances();
  save();
}

function removeFinItem(type, idx) {
  var fm = state.finMonth;
  var items = type === "income" ? state.finances.incomeItems : state.finances.expenseItems;
  if (!items[fm]) return;
  items[fm].splice(idx, 1);
  recalcFinances();
  save();
  renderFinances();
}

function addRecurringItem(type) {
  var arr = type === "income" ? state.finances.recurringIncome : state.finances.recurringExpenses;
  arr.push({ name: "", amount: 0 });
  recalcFinances();
  save();
  renderFinances();
}

function updateRecurringItem(type, idx, field, val) {
  var arr = type === "income" ? state.finances.recurringIncome : state.finances.recurringExpenses;
  if (!arr[idx]) return;
  if (field === "name") {
    var oldName = arr[idx].name;
    var newName = val;
    if (oldName !== newName && oldName) {
      var oType = type === "income" ? "income" : "expense";
      Object.keys(state.finances.overrides).forEach(function(m) {
        if (state.finances.overrides[m][oType] && state.finances.overrides[m][oType][oldName] !== undefined) {
          state.finances.overrides[m][oType][newName] = state.finances.overrides[m][oType][oldName];
          delete state.finances.overrides[m][oType][oldName];
        }
      });
    }
    arr[idx].name = newName;
  } else {
    arr[idx].amount = parseFloat(val) || 0;
  }
  recalcFinances();
  save();
}

function removeRecurringItem(type, idx) {
  var arr = type === "income" ? state.finances.recurringIncome : state.finances.recurringExpenses;
  if (!arr[idx]) return;
  var name = arr[idx].name;
  arr.splice(idx, 1);
  var oType = type === "income" ? "income" : "expense";
  Object.keys(state.finances.overrides).forEach(function(m) {
    if (state.finances.overrides[m][oType]) {
      delete state.finances.overrides[m][oType][name];
    }
  });
  recalcFinances();
  save();
  renderFinances();
}

function overrideRecurringItem(type, name, val) {
  var fm = state.finMonth;
  if (!state.finances.overrides[fm]) state.finances.overrides[fm] = {};
  var oType = type === "income" ? "income" : "expense";
  if (!state.finances.overrides[fm][oType]) state.finances.overrides[fm][oType] = {};
  var parsed = parseFloat(val);
  if (isNaN(parsed)) {
    delete state.finances.overrides[fm][oType][name];
  } else {
    state.finances.overrides[fm][oType][name] = parsed;
  }
  recalcFinances();
  save();
}

function clearOverride(type, name) {
  var fm = state.finMonth;
  var oType = type === "income" ? "income" : "expense";
  if (state.finances.overrides[fm] && state.finances.overrides[fm][oType]) {
    delete state.finances.overrides[fm][oType][name];
  }
  recalcFinances();
  save();
  renderFinances();
}

function renderFinances() {
  var fin = state.finances;
  var fm = state.finMonth;
  recalcFinances();

  var monthIncome = fin.income[fm] || 0;
  var monthExpense = fin.expenses[fm] || 0;
  var net = monthIncome - monthExpense;
  var savingsPct = fin.savingsGoal ? Math.min(100, Math.round((fin.savingsCurrent / fin.savingsGoal) * 100)) : 0;

  var incItems = fin.incomeItems[fm] || [];
  var expItems = fin.expenseItems[fm] || [];

  // Header + month pills
  var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px">' +
    '<h1>Finances <span>' + YEAR + '</span></h1><div class="month-pills">';

  MONTHS.forEach(function(mn, i) {
    var active = i === fm ? " active" : "";
    var past = i < TODAY_M ? " archived" : "";
    html += '<button class="month-pill' + active + past + '" onclick="state.finMonth=' + i + ';save();renderFinances()">' + mn + '</button>';
  });

  html += '</div></div>';

  // Summary cards
  var finAllZero = monthIncome === 0 && monthExpense === 0 && (fin.savingsCurrent || 0) === 0;
  if (finAllZero) {
    html += '<div class="empty-card" style="margin-bottom:16px">' +
      '<div class="empty-state-title">TRACK YOUR MONEY</div>' +
      '<div class="empty-state-text">Add income and expenses below to see your financial snapshot.</div></div>';
  } else {
    html += '<div class="fin-summary">' +
      '<div class="fin-stat"><div class="fin-stat-value" style="color:var(--greenT)">$' + monthIncome.toLocaleString() + '</div><div class="fin-stat-label">INCOME</div></div>' +
      '<div class="fin-stat"><div class="fin-stat-value" style="color:var(--redT)">$' + monthExpense.toLocaleString() + '</div><div class="fin-stat-label">EXPENSES</div></div>' +
      '<div class="fin-stat"><div class="fin-stat-value" style="color:' + (net >= 0 ? "var(--greenT)" : "var(--redT)") + '">$' + Math.abs(net).toLocaleString() + '</div><div class="fin-stat-label">' + (net >= 0 ? "SURPLUS" : "DEFICIT") + '</div></div>' +
      '</div>';
  }

  // Income card
  var monthOverrides = fin.overrides[fm] || {};
  var incOverrides = monthOverrides.income || {};
  var expOverrides = monthOverrides.expense || {};

  html += '<div class="card"><span class="section-label">INCOME &#183; ' + MONTHS[fm] + '</span>';

  if (fin.recurringIncome.length > 0) {
    html += '<div class="recurring-section" style="margin-top:14px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
      '<span style="font-size:9px;color:var(--text3);letter-spacing:1px">RECURRING</span></div>';
    fin.recurringIncome.forEach(function(item, i) {
      var hasOverride = incOverrides[item.name] !== undefined;
      var displayAmt = hasOverride ? incOverrides[item.name] : item.amount;
      html += '<div class="stream-row">' +
        '<input class="stream-name" value="' + esc(item.name) + '" placeholder="Income source..." oninput="updateRecurringItem(\'income\',' + i + ',\'name\',this.value)">' +
        (hasOverride ? '<span class="override-indicator">$' + item.amount + '</span>' : '') +
        '<span style="color:var(--text3);font-size:12px">$</span>' +
        '<input type="number" class="stream-amount" value="' + (displayAmt || "") + '" placeholder="0" oninput="overrideRecurringItem(\'income\',\'' + esc(item.name).replace(/'/g, "\\'") + '\',this.value)">' +
        (hasOverride ? '<button class="habit-del" onclick="clearOverride(\'income\',\'' + esc(item.name).replace(/'/g, "\\'") + '\')" title="Reset" style="color:var(--gold);opacity:.6">&#8634;</button>' : '') +
        '<button class="habit-del" onclick="removeRecurringItem(\'income\',' + i + ')">&times;</button>' +
        '</div>';
    });
    html += '<button class="habit-add-btn" onclick="addRecurringItem(\'income\')">+ Add recurring income</button></div>';
  } else {
    html += '<div style="margin-top:14px"><button class="habit-add-btn" onclick="addRecurringItem(\'income\')" style="border-color:rgba(200,169,81,.3);color:var(--gold);opacity:.5">+ Add recurring income</button></div>';
  }

  // One-time income
  html += '<div style="margin-top:' + (fin.recurringIncome.length > 0 ? '0' : '8px') + '">';
  if (incItems.length > 0 || fin.recurringIncome.length > 0) {
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
      '<span style="font-size:9px;color:var(--text3);letter-spacing:1px">ONE-TIME</span></div>';
  }
  incItems.forEach(function(item, i) {
    html += '<div class="stream-row">' +
      '<input class="stream-name" value="' + esc(item.name) + '" placeholder="Income source..." oninput="updateFinItem(\'income\',' + i + ',\'name\',this.value)">' +
      '<span style="color:var(--text3);font-size:12px">$</span>' +
      '<input type="number" class="stream-amount" value="' + (item.amount || "") + '" placeholder="0" oninput="updateFinItem(\'income\',' + i + ',\'amount\',this.value)">' +
      '<button class="habit-del" onclick="removeFinItem(\'income\',' + i + ')">&times;</button>' +
      '</div>';
  });
  html += '<button class="habit-add-btn" onclick="addFinItem(\'income\')">+ Add one-time income</button></div>';

  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">' +
    '<span style="color:var(--text2);font-size:12px">Total</span>' +
    '<span class="mono" style="color:var(--greenT);font-size:14px">$' + monthIncome.toLocaleString() + '</span>' +
    '</div></div>';

  // Expense card
  html += '<div class="card"><span class="section-label">EXPENSES &#183; ' + MONTHS[fm] + '</span>';

  if (fin.recurringExpenses.length > 0) {
    html += '<div class="recurring-section" style="margin-top:14px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
      '<span style="font-size:9px;color:var(--text3);letter-spacing:1px">RECURRING</span></div>';
    fin.recurringExpenses.forEach(function(item, i) {
      var hasOverride = expOverrides[item.name] !== undefined;
      var displayAmt = hasOverride ? expOverrides[item.name] : item.amount;
      html += '<div class="stream-row">' +
        '<input class="stream-name" value="' + esc(item.name) + '" placeholder="Expense name..." oninput="updateRecurringItem(\'expense\',' + i + ',\'name\',this.value)">' +
        (hasOverride ? '<span class="override-indicator">$' + item.amount + '</span>' : '') +
        '<span style="color:var(--text3);font-size:12px">$</span>' +
        '<input type="number" class="stream-amount" style="color:var(--redT)" value="' + (displayAmt || "") + '" placeholder="0" oninput="overrideRecurringItem(\'expense\',\'' + esc(item.name).replace(/'/g, "\\'") + '\',this.value)">' +
        (hasOverride ? '<button class="habit-del" onclick="clearOverride(\'expense\',\'' + esc(item.name).replace(/'/g, "\\'") + '\')" title="Reset" style="color:var(--gold);opacity:.6">&#8634;</button>' : '') +
        '<button class="habit-del" onclick="removeRecurringItem(\'expense\',' + i + ')">&times;</button>' +
        '</div>';
    });
    html += '<button class="habit-add-btn" onclick="addRecurringItem(\'expense\')">+ Add recurring expense</button></div>';
  } else {
    html += '<div style="margin-top:14px"><button class="habit-add-btn" onclick="addRecurringItem(\'expense\')" style="border-color:rgba(200,169,81,.3);color:var(--gold);opacity:.5">+ Add recurring expense</button></div>';
  }

  // One-time expenses
  html += '<div style="margin-top:' + (fin.recurringExpenses.length > 0 ? '0' : '8px') + '">';
  if (expItems.length > 0 || fin.recurringExpenses.length > 0) {
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
      '<span style="font-size:9px;color:var(--text3);letter-spacing:1px">ONE-TIME</span></div>';
  }
  expItems.forEach(function(item, i) {
    html += '<div class="stream-row">' +
      '<input class="stream-name" value="' + esc(item.name) + '" placeholder="Expense name..." oninput="updateFinItem(\'expense\',' + i + ',\'name\',this.value)">' +
      '<span style="color:var(--text3);font-size:12px">$</span>' +
      '<input type="number" class="stream-amount" style="color:var(--redT)" value="' + (item.amount || "") + '" placeholder="0" oninput="updateFinItem(\'expense\',' + i + ',\'amount\',this.value)">' +
      '<button class="habit-del" onclick="removeFinItem(\'expense\',' + i + ')">&times;</button>' +
      '</div>';
  });
  html += '<button class="habit-add-btn" onclick="addFinItem(\'expense\')">+ Add one-time expense</button></div>';

  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">' +
    '<span style="color:var(--text2);font-size:12px">Total</span>' +
    '<span class="mono" style="color:var(--redT);font-size:14px">$' + monthExpense.toLocaleString() + '</span>' +
    '</div></div>';

  // Savings goal
  html += '<div class="card"><span class="section-label">SAVINGS GOAL</span>' +
    '<div style="display:flex;align-items:baseline;gap:12px;margin-top:12px">' +
    '<span style="color:var(--text2);font-size:12px">$</span>' +
    '<input type="number" class="fin-month-input networth" style="width:100px;font-size:16px;padding:8px" value="' + (fin.savingsCurrent || "") + '" placeholder="0" oninput="state.finances.savingsCurrent=parseFloat(this.value)||0;save();renderFinances()">' +
    '<span style="color:var(--text3);font-size:13px">of $' + fin.savingsGoal.toLocaleString() + '</span>' +
    '<span class="mono" style="color:var(--gold);font-size:12px;margin-left:auto">' + savingsPct + '%</span>' +
    '</div>' +
    '<div class="savings-bar-track"><div class="savings-bar-fill" style="width:' + savingsPct + '%"></div></div>' +
    '<div style="display:flex;gap:8px;align-items:center;margin-top:8px">' +
    '<span style="color:var(--text3);font-size:11px">Goal: $</span>' +
    '<input type="number" class="fin-month-input networth" style="width:80px" value="' + (fin.savingsGoal || "") + '" placeholder="5000" oninput="state.finances.savingsGoal=parseFloat(this.value)||0;save();renderFinances()">' +
    '</div></div>';

  // Year overview bar chart
  html += '<div class="card"><span class="section-label">YEAR OVERVIEW</span>' +
    '<div style="display:flex;gap:4px;align-items:flex-end;height:80px;margin-top:16px">';
  var maxVal = 1;
  for (var yi = 0; yi < 12; yi++) {
    maxVal = Math.max(maxVal, fin.income[yi] || 0, fin.expenses[yi] || 0);
  }
  MONTHS.forEach(function(mn, i) {
    var incH = maxVal ? Math.max(1, ((fin.income[i] || 0) / maxVal) * 60) : 1;
    var expH = maxVal ? Math.max(1, ((fin.expenses[i] || 0) / maxVal) * 60) : 1;
    var isActive = i === fm;
    html += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;opacity:' + (isActive ? '1' : '.5') + '" onclick="state.finMonth=' + i + ';save();renderFinances()">' +
      '<div style="display:flex;gap:1px;align-items:flex-end;height:60px">' +
      '<div style="width:4px;height:' + incH + 'px;background:var(--greenT);border-radius:1px"></div>' +
      '<div style="width:4px;height:' + expH + 'px;background:var(--redT);border-radius:1px"></div>' +
      '</div>' +
      '<span style="font-size:8px;font-family:\'DM Mono\',monospace;color:' + (isActive ? 'var(--gold)' : 'var(--text3)') + '">' + mn + '</span>' +
      '</div>';
  });
  html += '</div></div>';

  // Net worth
  html += '<div class="card"><span class="section-label">NET WORTH</span><div class="fin-month-grid">';
  MONTHS.forEach(function(mn, i) {
    html += '<div class="fin-month-cell"><div class="fin-month-label">' + mn + '</div>' +
      '<input type="number" class="fin-month-input networth" value="' + (fin.netWorth[i] || "") + '" placeholder="\u2014" oninput="state.finances.netWorth[' + i + ']=parseFloat(this.value)||0;save()"></div>';
  });
  html += '</div></div>';

  document.getElementById("v-finances").innerHTML = html;
}

// === INIT ===
load();
</script>
</body>
</html>
